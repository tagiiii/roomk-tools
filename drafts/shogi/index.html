<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>将棋（試作） | あそびのたな</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Noto+Serif+JP:wght@600;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,1,0" rel="stylesheet" />
  <link rel="stylesheet" href="../../apps/shared/css/design-system.css?v=20261106c" />
  <link rel="stylesheet" href="style.css?v=20261114a" />
</head>
<body>
  <main class="sh-wrap">

    <!-- トップ -->
    <section class="sh-screen sh-front active" id="screen-top">
      <div class="sh-panel">
        <p class="sh-badge">試作</p>
        <h1 class="sh-title">将棋</h1>
        <p class="sh-lead">2人で交互に駒を動かして、相手の王を詰ませたら勝ち。小さい盤の「5五将棋」なら、1局が短く終わる。</p>
        <div class="sh-actions">
          <button type="button" class="btn btn-primary btn-lg btn-full" id="btnOne">1台の画面でためす</button>
          <button type="button" class="btn btn-secondary btn-full" id="btnTwo0">2つのウィンドウでためす（先手になる）</button>
          <button type="button" class="btn btn-secondary btn-full" id="btnTwo1">2つのウィンドウでためす（後手になる）</button>
          <p class="sh-note">2つのウィンドウは、本体にしたときのルーム対戦のかわり。このページをもう1つのウィンドウで開き、もう一方を選ぶ。同じパソコンの中だけでつながる（通信はしない）。先手のウィンドウが、盤を選んで始める。</p>
        </div>
      </div>
    </section>

    <!-- 準備 -->
    <section class="sh-screen sh-front" id="screen-setup">
      <div class="sh-panel sh-panel--wide">
        <button type="button" class="sh-quiet sh-back" id="btnSetupBack"><span class="material-symbols-rounded">arrow_back</span>もどる</button>
        <h2 class="sh-title sh-title--sub">対局の準備</h2>

        <fieldset class="sh-fieldset">
          <legend class="sh-legend">盤</legend>
          <div class="sh-variants">
            <label class="sh-variant">
              <input type="radio" name="variant" value="mini" checked />
              <span class="sh-variant__box">
                <span class="sh-variant__name">5五将棋</span>
                <span class="sh-variant__sub">5×5 の小さい盤。駒は6種類で、5〜10分で終わる</span>
              </span>
            </label>
            <label class="sh-variant">
              <input type="radio" name="variant" value="hon" />
              <span class="sh-variant__box">
                <span class="sh-variant__name">本将棋</span>
                <span class="sh-variant__sub">9×9 のふつうの将棋。30分以上かかることもある</span>
              </span>
            </label>
          </div>
        </fieldset>

        <fieldset class="sh-fieldset">
          <legend class="sh-legend">名前（なくてもよい）</legend>
          <div class="sh-names">
            <label class="sh-name">
              <span class="sh-name__label">▲ 先手（先に指す）</span>
              <input type="text" class="form-input" id="name0" maxlength="10" autocomplete="off" />
            </label>
            <label class="sh-name">
              <span class="sh-name__label">△ 後手</span>
              <input type="text" class="form-input" id="name1" maxlength="10" autocomplete="off" />
            </label>
          </div>
        </fieldset>

        <div class="sh-aid" id="aidSetup"></div>

        <button type="button" class="btn btn-primary btn-lg btn-full" id="btnStart">はじめる</button>
      </div>
    </section>

    <!-- 後手のウィンドウ: 先手が始めるのを待つ -->
    <section class="sh-screen sh-front" id="screen-wait">
      <div class="sh-panel">
        <h2 class="sh-title sh-title--sub">先手を待っています</h2>
        <p class="sh-lead">もう1つのウィンドウで「2つのウィンドウでためす（先手になる）」を選び、盤を決めて「はじめる」を押してね。</p>
        <button type="button" class="sh-quiet" id="btnWaitBack"><span class="material-symbols-rounded">arrow_back</span>トップへ戻る</button>
      </div>
    </section>

    <!-- 対局 -->
    <section class="sh-screen" id="screen-game">
      <p class="sh-status" id="status" aria-live="polite"></p>

      <div class="sh-table" id="table">
        <div class="sh-side sh-side--top" id="sideTop"></div>
        <div class="sh-boardhost">
          <div class="sh-board" id="board"></div>
          <div class="sh-result" id="resultBox" hidden>
            <div class="sh-result__card">
              <p class="sh-result__big" id="resultText"></p>
              <p class="sh-result__sub" id="resultSub"></p>
              <button type="button" class="btn btn-primary btn-lg" id="btnAgain">もう一回（先手と後手を入れかえる）</button>
              <button type="button" class="sh-quiet" id="btnSeeBoard">盤を見る</button>
            </div>
          </div>
        </div>
        <div class="sh-side sh-side--bottom" id="sideBottom"></div>
      </div>

      <p class="sh-msg" id="msg" aria-live="polite"></p>
      <p class="sh-lastline" id="lastLine"></p>

      <div class="sh-tools">
        <button type="button" class="sh-quiet" id="btnUndo"><span class="material-symbols-rounded">undo</span>1手もどす</button>
        <button type="button" class="sh-quiet" id="btnFlip"><span class="material-symbols-rounded">swap_vert</span>盤の向きを変える</button>
        <button type="button" class="sh-quiet" id="btnAidToggle" aria-expanded="false"><span class="material-symbols-rounded">tune</span>補助の設定</button>
        <button type="button" class="sh-quiet" id="btnResultShow" hidden><span class="material-symbols-rounded">flag</span>結果を見る</button>
        <button type="button" class="sh-quiet" id="btnRestart"><span class="material-symbols-rounded">restart_alt</span>準備にもどる</button>
        <button type="button" class="sh-quiet" id="btnTop"><span class="material-symbols-rounded">home</span>トップへ戻る</button>
      </div>
      <div class="card sh-aidcard" id="aidGame" hidden></div>
    </section>

    <!-- 成る・成らない -->
    <div class="sh-modal" id="promoModal" hidden>
      <div class="sh-modal__card" role="dialog" aria-modal="true" aria-labelledby="promoTitle">
        <p class="sh-modal__title" id="promoTitle">成りますか？</p>
        <div class="sh-modal__choices">
          <button type="button" class="sh-choice" id="btnPromoYes"><span class="sh-choice__piece" id="promoYesPiece"></span><span>成る</span></button>
          <button type="button" class="sh-choice" id="btnPromoNo"><span class="sh-choice__piece" id="promoNoPiece"></span><span>成らない</span></button>
        </div>
        <button type="button" class="sh-quiet" id="btnPromoCancel">やめる</button>
      </div>
    </div>

  </main>

  <script src="engine.js?v=20261114a"></script>
  <script src="app.js?v=20261114a"></script>
</body>
</html>
