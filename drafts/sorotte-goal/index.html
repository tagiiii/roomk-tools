<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>そろってゴール（試作） | あそびのたな</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,1,0" rel="stylesheet" />
  <link rel="stylesheet" href="../../apps/shared/css/design-system.css?v=20261106c" />
  <link rel="stylesheet" href="style.css?v=20261112b" />
</head>
<body>
  <main class="sg-wrap">

    <!-- トップ -->
    <section class="sg-screen active" id="screen-top">
      <div class="sg-panel">
        <div class="sg-duo" id="duo" aria-hidden="true"></div>
        <p class="sg-badge">試作</p>
        <h1 class="sg-title">そろってゴール</h1>
        <p class="sg-lead">2人でコマを1マスずつ動かして、2人ともゴールに入るとクリア。とびら・重い箱・カギは、1人では進めない。声をかけ合って進もう。</p>
        <div class="sg-actions">
          <button type="button" class="btn btn-primary btn-lg btn-full" id="btnOne">1台の画面でためす</button>
          <p class="sg-note">1つのキーボードを2人で使う。1人目は W・A・S・D、2人目は矢印キー。</p>
          <button type="button" class="btn btn-secondary btn-full" id="btnTwo1">2つのウィンドウでためす（1人目になる）</button>
          <button type="button" class="btn btn-secondary btn-full" id="btnTwo2">2つのウィンドウでためす（2人目になる）</button>
          <p class="sg-note">このページをもう1つのウィンドウで開き、もう一方を選ぶ。同じパソコンの中だけでつながる（通信はしない）。</p>
        </div>
      </div>
    </section>

    <!-- ステージ -->
    <section class="sg-screen" id="screen-game">
      <div class="sg-head">
        <p class="sg-stage" id="stageName"></p>
        <p class="sg-hint" id="stageHint"></p>
        <p class="sg-you" id="youLine" hidden></p>
      </div>

      <div class="sg-boardhost">
        <div class="sg-board" id="board" role="img" aria-label="ステージ"></div>
        <div class="sg-clear" id="clearBox" aria-live="polite" hidden>
          <div class="sg-clear__card">
            <p class="sg-clear__big" id="clearText"></p>
            <button type="button" class="btn btn-primary btn-lg" id="btnNext"></button>
          </div>
        </div>
      </div>

      <div class="sg-pads" id="pads"></div>

      <ul class="sg-legend" id="legend"></ul>

      <div class="sg-tools">
        <button type="button" class="btn btn-secondary" id="btnRetry">このステージをやりなおす</button>
        <div class="sg-jump" id="jump"></div>
        <button type="button" class="sg-quiet" id="btnTop">トップへ戻る</button>
      </div>
    </section>

  </main>

  <script src="engine.js?v=20261112b"></script>
  <script src="art.js?v=20261112b"></script>
  <script src="app.js?v=20261112b"></script>
</body>
</html>
