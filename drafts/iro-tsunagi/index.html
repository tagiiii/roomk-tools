<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
  <title>いろつなぎ（試作） | あそびのたな</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,1,0" rel="stylesheet">
  <link rel="stylesheet" href="../../apps/shared/css/design-system.css?v=20261106c">
  <link rel="stylesheet" href="style.css?v=20261113a">
  <script src="engine.js?v=20261113a"></script>
</head>
<body data-genre="puzzle">
  <main class="it-wrap">

    <!-- はじめの画面 -->
    <section class="it-screen active" id="screen-top">
      <div class="app-entry">
        <div class="app-hero">
          <svg class="it-hero" viewBox="0 0 160 120" width="156" height="117" aria-hidden="true">
            <rect x="42" y="66" width="36" height="20" fill="#E0706A"/>
            <rect x="82" y="66" width="36" height="20" fill="#E0706A"/>
            <rect x="110" y="38" width="16" height="36" fill="#E0706A"/>
            <circle cx="40" cy="76" r="18" fill="#E0706A"/><circle cx="80" cy="76" r="18" fill="#E0706A"/>
            <circle cx="120" cy="76" r="18" fill="#E0706A"/><circle cx="120" cy="38" r="18" fill="#E0706A"/>
            <circle cx="40" cy="38" r="18" fill="#4F86C6"/><circle cx="80" cy="38" r="18" fill="#F2C14E"/>
            <g fill="#fff" opacity=".9">
              <circle cx="40" cy="76" r="6"/><circle cx="80" cy="76" r="6"/><circle cx="120" cy="76" r="6"/><circle cx="120" cy="38" r="6"/>
              <path d="M40 31 l7 12 h-14z"/><path d="M80 30 l2.3 5 5.4.6-4 3.7 1.1 5.4-4.8-2.7-4.8 2.7 1.1-5.4-4-3.7 5.4-.6z"/>
            </g>
          </svg>
        </div>
        <p class="it-badge">試作</p>
        <h1 class="app-title">いろつなぎ</h1>
        <p class="app-catch">同じ色を4つつなげて消そう</p>
        <p class="app-entry__lead">上から2つ1組の玉が落ちてくる。回して置いて、同じ色を縦か横に4つ以上つなげると消える。消えたあとに落ちた玉がまたつながると「れんさ」になる。</p>
        <ul class="app-entry__notes">
          <li>色ごとに中の形がちがうので、形でも見分けられるよ</li>
          <li>盤がいっぱいになっても、からにしてつづけられるよ</li>
        </ul>

        <fieldset class="it-fieldset">
          <legend class="it-legend">色の数</legend>
          <div class="it-seg it-seg--3">
            <label class="it-seg__opt"><input type="radio" name="colors" value="3"><span>3色</span></label>
            <label class="it-seg__opt"><input type="radio" name="colors" value="4" checked><span>4色</span></label>
            <label class="it-seg__opt"><input type="radio" name="colors" value="5"><span>5色</span></label>
          </div>
          <p class="it-note">少ないほど、つながりやすい。</p>
        </fieldset>
        <fieldset class="it-fieldset">
          <legend class="it-legend">落ちる速さ</legend>
          <div class="it-seg it-seg--3">
            <label class="it-seg__opt"><input type="radio" name="speed" value="slow" checked><span>ゆっくり</span></label>
            <label class="it-seg__opt"><input type="radio" name="speed" value="normal"><span>ふつう</span></label>
            <label class="it-seg__opt"><input type="radio" name="speed" value="fast"><span>はやい</span></label>
          </div>
        </fieldset>
        <fieldset class="it-fieldset">
          <legend class="it-legend">盤がいっぱいになったら</legend>
          <div class="it-seg it-seg--2">
            <label class="it-seg__opt"><input type="radio" name="full" value="clear" checked><span>からにしてつづける</span></label>
            <label class="it-seg__opt"><input type="radio" name="full" value="end"><span>おしまい</span></label>
          </div>
        </fieldset>

        <div class="app-entry__actions">
          <button type="button" class="btn btn-primary btn-lg btn-full" id="btnStart">はじめる</button>
        </div>
      </div>
    </section>

    <!-- あそぶ画面 -->
    <section class="it-screen" id="screen-play">
      <div class="it-play">
        <div class="it-boardbox">
          <canvas id="board" class="it-board" role="img" aria-label="いろつなぎの盤"></canvas>
          <p class="it-chain" id="chainText" aria-live="polite"></p>
          <div class="it-overlay" id="overlay" hidden>
            <p class="it-overlay__text" id="overlayText"></p>
            <button type="button" class="btn btn-primary" id="btnResume" hidden>つづける</button>
          </div>
        </div>

        <aside class="it-side">
          <div class="it-next">
            <p class="it-side__label">つぎ</p>
            <div class="it-next__pairs">
              <canvas id="next1" class="it-next__c" width="60" height="110" aria-hidden="true"></canvas>
              <canvas id="next2" class="it-next__c it-next__c--sub" width="60" height="110" aria-hidden="true"></canvas>
            </div>
          </div>
          <div class="it-stat">
            <p class="it-side__label">点</p>
            <p class="it-stat__num" id="score">0</p>
          </div>
          <div class="it-stat">
            <p class="it-side__label">最高れんさ</p>
            <p class="it-stat__num" id="best">0</p>
          </div>
          <div class="it-side__btns">
            <button type="button" class="btn btn-secondary btn-sm" id="btnPause">ひと休み</button>
            <button type="button" class="it-quiet" id="btnQuit">やめる</button>
          </div>
          <p class="it-keys">キーボード: ← → で動かす・↑ か X で右に回す・Z で左に回す・↓ で下げる・スペースで一気に落とす</p>
        </aside>
      </div>

      <div class="it-pad" aria-label="操作ボタン">
        <button type="button" class="it-pad__btn" data-act="left" aria-label="左へ"><span class="material-symbols-rounded" aria-hidden="true">arrow_back</span></button>
        <button type="button" class="it-pad__btn" data-act="rotL" aria-label="左に回す"><span class="material-symbols-rounded" aria-hidden="true">rotate_left</span></button>
        <button type="button" class="it-pad__btn" data-act="rotR" aria-label="右に回す"><span class="material-symbols-rounded" aria-hidden="true">rotate_right</span></button>
        <button type="button" class="it-pad__btn" data-act="right" aria-label="右へ"><span class="material-symbols-rounded" aria-hidden="true">arrow_forward</span></button>
        <button type="button" class="it-pad__btn" data-act="down" aria-label="下げる"><span class="material-symbols-rounded" aria-hidden="true">arrow_downward</span></button>
        <button type="button" class="it-pad__btn" data-act="drop" aria-label="一気に落とす"><span class="material-symbols-rounded" aria-hidden="true">vertical_align_bottom</span></button>
      </div>
    </section>

    <!-- おしまい -->
    <section class="it-screen" id="screen-end">
      <div class="it-panel">
        <h2 class="it-end__title">おしまい</h2>
        <dl class="it-end__list">
          <div><dt>点</dt><dd id="endScore">0</dd></div>
          <div><dt>最高れんさ</dt><dd id="endBest">0</dd></div>
          <div><dt>消した玉</dt><dd id="endPops">0</dd></div>
        </dl>
        <button type="button" class="btn btn-primary btn-lg btn-full" id="btnAgain">もう一回</button>
        <button type="button" class="it-quiet it-quiet--center" id="btnTop">はじめの画面へ</button>
      </div>
    </section>

  </main>
  <script src="app.js?v=20261113c"></script>
</body>
</html>
