<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>チャレンジのたね | room-K</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,1,0" rel="stylesheet" />
  <link rel="stylesheet" href="../shared/css/design-system.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="ct-shell">
    <header class="ct-header">
      <div>
        <h1 class="ct-header__title">チャレンジのたね</h1>
        <p class="ct-header__sub">「やってみたいかも」のたねを集めておくところ</p>
      </div>
      <a class="ct-header__link" href="../">
        <span class="material-symbols-rounded" aria-hidden="true">home</span>
        ツール一覧
      </a>
    </header>

    <main class="ct-main">
      <section class="screen" id="screen-start" aria-labelledby="start-title"></section>
      <section class="screen" id="screen-load-confirm" aria-labelledby="load-confirm-title"></section>
      <section class="screen" id="screen-home" aria-labelledby="home-title"></section>
      <section class="screen" id="screen-edit" aria-labelledby="edit-title"></section>
      <section class="screen" id="screen-save" aria-labelledby="save-title"></section>
    </main>
  </div>

  <div class="ct-toast" id="toast" role="status" aria-live="polite"></div>
  <input class="ct-file-input" id="recordFile" type="file" accept="application/json,.json" aria-label="記録ファイル（JSON）を選ぶ" />

  <script type="module" src="app.js"></script>
  <script src="../shared/js/stats.js?v=1" defer></script>
  <script src="../shared/js/howto.js"></script>
  <script>
    RoomkHowto.init({
      title: 'つかいかた',
      lead: '「やってみたいかも」と思ったことを「たね」としてためておくところ。ここではまだ計画は立てないよ。',
      sections: [
        { heading: 'はじめかた', items: [
          'はじめてなら「はじめて使う」を押す',
          '前に使ったことがあるなら「前回のファイルを開く」で、保存したファイルを選ぶ',
        ] },
        { heading: 'すすめかた', items: [
          '「新しいたねを増やす」を押して、やってみたいかもと思ったことを書く',
          'たねを入れるポケットは4つのどれでもOK。あとからいつでも動かせるよ',
          '「なおす」を押すと、書きなおしたり消したりできる',
        ] },
        { heading: 'おわりかた', items: [
          '「今日のぶんを保存する」を押して、記録ファイルをダウンロードする',
          '次のときは、そのファイルを開くと続きができるよ',
        ] },
      ],
    });
  </script>
</body>
</html>
