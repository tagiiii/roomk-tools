<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
  <title>きょうの2たく</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,1,0" rel="stylesheet">
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
  <script src="../shared/js/rtdb-utils.js"></script>
  <link rel="stylesheet" href="../shared/css/design-system.css">
  <style>
    .nb-page {
      width: 100%;
      max-width: 560px;
      margin: 0 auto;
      padding: 24px 16px 72px;
    }

    /* ── ヘッダー ── */
    .nb-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 18px;
    }
    .nb-header__icon {
      display: flex; align-items: center; justify-content: center;
      width: 46px; height: 46px; flex-shrink: 0;
      background: var(--color-primary); border-radius: 14px;
    }
    .nb-header__icon .material-symbols-rounded { font-size: 26px; color: #fff; }
    .nb-header__title { font-size: 21px; font-weight: 700; color: var(--color-primary); line-height: 1.2; }
    .nb-header__sub { font-size: 12px; color: var(--color-muted); margin-top: 3px; }
    .nb-header__mentor {
      margin-left: auto; flex-shrink: 0;
      font-size: 11px; font-weight: 700; color: var(--color-accent);
      border: 1px solid var(--color-accent); border-radius: 999px;
      padding: 3px 10px;
    }

    /* ── 日めくりナビ ── */
    .nb-daynav {
      display: flex; align-items: center; justify-content: space-between;
      gap: 8px; margin-bottom: 14px;
    }
    .nb-daynav__btn {
      display: flex; align-items: center; gap: 2px;
      font-family: var(--font-base); font-size: 13px; font-weight: 700;
      color: var(--color-accent); background: var(--color-surface);
      border: 1px solid var(--color-border); border-radius: 999px;
      padding: 7px 12px; cursor: pointer;
    }
    .nb-daynav__btn .material-symbols-rounded { font-size: 18px; }
    .nb-daynav__btn:disabled { opacity: 0.35; cursor: default; }
    .nb-daynav__label { font-size: 14px; font-weight: 700; color: var(--color-text); }

    /* ── バナー ── */
    .nb-banner {
      display: flex; align-items: center; gap: 8px;
      font-size: 13px; font-weight: 500; color: var(--color-muted);
      background: var(--color-surface); border: 1px dashed var(--color-border);
      border-radius: 10px; padding: 10px 14px; margin-bottom: 14px;
    }
    .nb-banner .material-symbols-rounded { font-size: 18px; }
    .nb-banner--full { color: var(--color-primary); border-style: solid; }
    /* display:flex が UA の [hidden] { display:none } に勝ってしまうため明示する */
    .nb-banner[hidden], .nb-loading[hidden] { display: none; }

    /* ── お題 ── */
    .nb-topic {
      text-align: center;
      background: var(--color-primary);
      border-radius: 16px;
      padding: 18px 16px;
      margin-bottom: 14px;
    }
    .nb-topic__label {
      font-size: 11px; font-weight: 700; letter-spacing: 0.14em;
      color: rgba(255, 255, 255, 0.75); margin-bottom: 6px;
    }
    .nb-topic__lead { font-size: 20px; font-weight: 700; color: #fff; line-height: 1.4; }

    /* ── ボード ── */
    .nb-board {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .nb-area {
      display: flex; flex-direction: column;
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: 14px;
      padding: 12px;
      min-height: 150px;
      cursor: pointer;
    }
    .nb-area:focus-visible { outline: 3px solid var(--color-accent); outline-offset: 2px; }
    .nb-area__head {
      display: flex; align-items: flex-start; gap: 8px;
      margin-bottom: 10px;
    }
    .nb-area__num {
      color: var(--color-accent); font-weight: 700; font-size: 17px;
      font-feature-settings: "palt"; flex-shrink: 0; line-height: 1.4;
    }
    .nb-area__label { flex: 1; font-size: 15px; font-weight: 700; line-height: 1.4; text-align: left; }
    .nb-area__stamps {
      display: flex; flex-wrap: wrap; align-content: flex-start;
      gap: 8px 6px; flex: 1;
    }
    .nb-area__hint {
      display: flex; align-items: center; justify-content: center; gap: 2px;
      font-size: 12px; color: var(--color-muted);
      border: 1px dashed var(--color-border); border-radius: 8px;
      padding: 6px; margin-top: 10px;
    }
    .nb-area__hint .material-symbols-rounded { font-size: 16px; }
    .nb-area__hint[hidden] { display: none; }

    /* ── スタンプ ── */
    .nb-stamp {
      display: flex; flex-direction: column; align-items: center; gap: 2px;
      width: 46px; padding: 0; border: none; background: none;
      font-family: var(--font-base); cursor: pointer;
    }
    .nb-stamp__chip {
      display: flex; align-items: center; justify-content: center;
      width: 36px; height: 36px; border-radius: 50%;
    }
    .nb-stamp__chip .material-symbols-rounded { font-size: 22px; }
    .nb-stamp--mine .nb-stamp__chip { box-shadow: 0 0 0 2px var(--color-accent); }
    .nb-stamp__name {
      font-size: 9px; color: var(--color-muted); max-width: 46px;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }

    .nb-movehint {
      font-size: 12px; color: var(--color-muted); text-align: center;
      margin-top: 12px;
    }
    .nb-note {
      font-size: 11px; color: var(--color-muted); text-align: center;
      margin-top: 20px;
    }
    .nb-loading { display: flex; justify-content: center; padding: 32px 0; }

    /* ── モーダル ── */
    .nb-modal {
      position: fixed; inset: 0; z-index: 100;
      display: flex; align-items: center; justify-content: center;
    }
    .nb-modal[hidden] { display: none; }
    .nb-modal__backdrop { position: absolute; inset: 0; background: rgba(26, 26, 26, 0.45); }
    .nb-modal__sheet {
      position: relative;
      width: min(92vw, 420px); max-height: 86dvh; overflow-y: auto;
      background: var(--color-surface); border-radius: 18px;
      padding: 20px;
    }
    .nb-picker__where {
      display: flex; align-items: center; gap: 8px;
      font-size: 15px; font-weight: 700; margin-bottom: 14px;
    }
    .nb-picker__where-num { color: var(--color-accent); flex-shrink: 0; }
    .nb-picker__section {
      font-size: 12px; font-weight: 700; color: var(--color-muted);
      margin: 12px 0 8px;
    }
    .nb-picker__icons {
      display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px;
    }
    .nb-picker__icon {
      display: flex; align-items: center; justify-content: center;
      aspect-ratio: 1; border: 2px solid var(--color-border); border-radius: 10px;
      background: var(--color-surface); cursor: pointer; padding: 0;
    }
    .nb-picker__icon .material-symbols-rounded { font-size: 22px; color: var(--color-muted); }
    .nb-picker__icon.selected { border-color: var(--color-accent); background: rgba(46, 125, 140, 0.10); }
    .nb-picker__icon.selected .material-symbols-rounded { color: var(--color-accent); }
    .nb-picker__colors { display: flex; gap: 8px; flex-wrap: wrap; }
    .nb-picker__color {
      width: 34px; height: 34px; border-radius: 50%;
      border: none; cursor: pointer; padding: 0;
    }
    .nb-picker__color.selected { box-shadow: 0 0 0 3px var(--color-surface), 0 0 0 5px var(--color-accent); }
    .nb-picker__preview {
      display: flex; align-items: center; justify-content: center;
      margin: 14px 0 4px;
    }
    .nb-picker__buttons { display: flex; flex-direction: column; gap: 8px; margin-top: 16px; }

    /* ── くわしくモーダル ── */
    .nb-detail { text-align: center; }
    .nb-detail__chip {
      display: flex; align-items: center; justify-content: center;
      width: 60px; height: 60px; border-radius: 50%; margin: 4px auto 10px;
    }
    .nb-detail__chip .material-symbols-rounded { font-size: 36px; }
    .nb-detail__name { font-size: 16px; font-weight: 700; }
    .nb-detail__area { font-size: 13px; color: var(--color-muted); margin-top: 4px; }
    .nb-detail__comment {
      font-size: 14px; line-height: 1.6;
      background: var(--color-bg); border-radius: 10px;
      padding: 10px 14px; margin-top: 12px;
      overflow-wrap: anywhere;
    }
    .nb-detail__comment--empty { color: var(--color-muted); }
    .nb-detail__buttons { display: flex; flex-direction: column; gap: 8px; margin-top: 18px; }

    @media (max-width: 600px) {
      .nb-page { padding: 18px 12px 60px; }
      .nb-header__sub { font-size: 11px; }
      .nb-topic__lead { font-size: 18px; }
      .nb-area { padding: 10px; min-height: 130px; }
      .nb-area__label { font-size: 14px; }
    }
  </style>
</head>
<body>

<div class="nb-page">

  <header class="nb-header">
    <div class="nb-header__icon"><span class="material-symbols-rounded">how_to_vote</span></div>
    <div>
      <h1 class="nb-header__title">きょうの2たく</h1>
      <p class="nb-header__sub">スタンプをおいてこたえる日がわりボード。みるだけでもOK</p>
    </div>
    <span id="mentor-chip" class="nb-header__mentor" hidden>メンター表示</span>
  </header>

  <nav class="nb-daynav" aria-label="日付の切りかえ">
    <button type="button" id="btn-prev" class="nb-daynav__btn">
      <span class="material-symbols-rounded">chevron_left</span>まえの日
    </button>
    <div id="daynav-label" class="nb-daynav__label" aria-live="polite"></div>
    <button type="button" id="btn-next" class="nb-daynav__btn">
      つぎの日<span class="material-symbols-rounded">chevron_right</span>
    </button>
  </nav>

  <div id="banner-readonly" class="nb-banner" hidden>
    <span class="material-symbols-rounded">visibility</span>この日はみるだけ。スタンプはおけないよ
  </div>
  <div id="banner-full" class="nb-banner nb-banner--full" hidden>
    <span class="material-symbols-rounded">celebration</span>きょうはまんいん！また明日
  </div>

  <section class="nb-topic">
    <div id="topic-label" class="nb-topic__label">きょうの2たく</div>
    <div id="topic-lead" class="nb-topic__lead"></div>
  </section>

  <div id="loading" class="nb-loading"><div class="spinner"></div></div>

  <div id="board" class="nb-board" hidden>
    <section class="nb-area" data-area="1" role="button" tabindex="0">
      <header class="nb-area__head">
        <span class="nb-area__num">①</span><span class="nb-area__label" id="area-label-1"></span>
      </header>
      <div class="nb-area__stamps" id="area-stamps-1"></div>
      <div class="nb-area__hint"><span class="material-symbols-rounded">add</span>ここにおく</div>
    </section>
    <section class="nb-area" data-area="2" role="button" tabindex="0">
      <header class="nb-area__head">
        <span class="nb-area__num">②</span><span class="nb-area__label" id="area-label-2"></span>
      </header>
      <div class="nb-area__stamps" id="area-stamps-2"></div>
      <div class="nb-area__hint"><span class="material-symbols-rounded">add</span>ここにおく</div>
    </section>
    <section class="nb-area" data-area="3" role="button" tabindex="0">
      <header class="nb-area__head">
        <span class="nb-area__num">③</span><span class="nb-area__label" id="area-label-3">どっちも</span>
      </header>
      <div class="nb-area__stamps" id="area-stamps-3"></div>
      <div class="nb-area__hint"><span class="material-symbols-rounded">add</span>ここにおく</div>
    </section>
    <section class="nb-area" data-area="4" role="button" tabindex="0">
      <header class="nb-area__head">
        <span class="nb-area__num">④</span><span class="nb-area__label" id="area-label-4">どっちでもない</span>
      </header>
      <div class="nb-area__stamps" id="area-stamps-4"></div>
      <div class="nb-area__hint"><span class="material-symbols-rounded">add</span>ここにおく</div>
    </section>
  </div>

  <p id="move-hint" class="nb-movehint" hidden>べつのエリアをタップすると、スタンプがおひっこしするよ</p>
  <p class="nb-note">スタンプはボードにのこって、7日たつと自動でかたづくよ</p>

</div>

<!-- スタンプをおくモーダル -->
<div id="modal-picker" class="nb-modal" hidden>
  <div class="nb-modal__backdrop" data-close="picker"></div>
  <div class="nb-modal__sheet" role="dialog" aria-modal="true" aria-label="スタンプをえらぶ">
    <div class="nb-picker__where">
      <span class="nb-picker__where-num" id="picker-area-num"></span>
      <span id="picker-area-label"></span>
    </div>

    <div class="nb-picker__section">スタンプ</div>
    <div class="nb-picker__icons" id="picker-icons"></div>

    <div class="nb-picker__section">いろ</div>
    <div class="nb-picker__colors" id="picker-colors"></div>

    <div class="nb-picker__preview">
      <span class="nb-stamp__chip" id="picker-preview-chip"><span class="material-symbols-rounded" id="picker-preview-icon"></span></span>
    </div>

    <div class="form-group">
      <label class="form-label" for="input-name">なまえ（なくてもOK・8文字まで）</label>
      <input type="text" class="form-input" id="input-name" maxlength="8" placeholder="だれか">
    </div>
    <div class="form-group">
      <label class="form-label" for="input-comment">ひとこと（なくてもOK・20文字まで）</label>
      <input type="text" class="form-input" id="input-comment" maxlength="20" placeholder="">
    </div>

    <div class="nb-picker__buttons">
      <button type="button" class="btn btn-primary btn-full" id="btn-place">ここにおく</button>
      <button type="button" class="btn btn-ghost btn-full" data-close="picker">やめる</button>
    </div>
  </div>
</div>

<!-- スタンプのくわしくモーダル -->

  <div class="nb-modal__backdrop" data-close="detail"></div>

    <div class="nb-detail__name" id="detail-name"></div>
    <div class="nb-detail__area" id="detail-area"></div>
    <div class="nb-detail__comment" id="detail-comment"></div>
    <div class="nb-detail__buttons">
      <button type="button" class="btn btn-danger btn-full" id="btn-delete" hidden>このスタンプをけす</button>
      <button type="button" class="btn btn-ghost btn-full" data-close="detail">とじる</button>
    </div>
  </div>
</div>

  // ════════════════════════════════════
  // 状態管理
  // 常設ボードのため role / roomCode は持たない（AGENTS.md 参照）
  // ════════════════════════════════════
  const state = {
    todayKey: null,        // きょうの日付キー（JST・YYYY-MM-DD）
    viewKey: null,         // 表示中の日付キー
    votes: {},             // 表示中の日の votes スナップショット
    votesRef: null,        // きょうの votes への参照（リスナー解除用）
    votesListener: null,
    myVoteId: null,        // きょう自分がおいたスタンプの pushId
    detailId: null,        // くわしくモーダルで表示中の pushId
    pendingArea: null,     // ピッカーで選択中のエリア (1-4)
    picker: { icon: ICONS[0].name, color: COLORS[0].hex },
    lastName: '',
    dayCheckInterval: null,
    loaded: false,
  };

  // ════════════════════════════════════
  // ユーティリティ
  // ════════════════════════════════════
  function esc(s) {
    return String(s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  // JST 固定で日付キーを作る（端末のタイムゾーンに依存しない）
  function dateKeyFromMs(ms) {
    return new Date(ms + 9 * 60 * 60 * 1000).toISOString().slice(0, 10);
  }

  function shiftKey(key, days) {
    const d = new Date(key + 'T00:00:00Z');
    d.setUTCDate(d.getUTCDate() + days);
    return d.toISOString().slice(0, 10);
  }

  // 日付文字列から決定論的に1問えらぶ（同じ日はどの端末でも同じお題）
  function topicForDate(key) {
    let h = 5381;
    for (let i = 0; i < key.length; i++) {
      h = ((h * 33) ^ key.charCodeAt(i)) >>> 0;
    }
    return TOPICS[h % TOPICS.length];
  }

  function sanitizeIcon(v) {
    return ICONS.some((i) => i.name === v) ? v : ICONS[0].name;
  }
  function sanitizeColor(v) {
    return COLORS.some((c) => c.hex === v) ? v : COLORS[0].hex;
  }
  function displayName(v) {
    const name = String(v || '').slice(0, NAME_MAX).trim();
    return name || 'だれか';
  }
  function votesCount() {
    return Object.keys(state.votes).length;
  }
  function isViewingToday() {
    return state.viewKey === state.todayKey;
  }
  function areaLabels(key) {
    const topic = topicForDate(key);
    return [topic.a, topic.b, 'どっちも', 'どっちでもない'];
  }

  // ════════════════════════════════════
  // sessionStorage（きょうの自分のスタンプ + えらんだ見た目のおぼえ）
  // ════════════════════════════════════
  function saveSession() {
    try {
      sessionStorage.setItem(SESSION_KEY, JSON.stringify({
        dateKey: state.todayKey,
        voteId: state.myVoteId,
        icon: state.picker.icon,
        color: state.picker.color,
        name: state.lastName,
      }));
    } catch (e) { /* プライベートモード等では保存しない */ }
  }

  function restoreSession() {
    try {
      const raw = sessionStorage.getItem(SESSION_KEY);
      if (!raw) return;
      const s = JSON.parse(raw);
      state.picker.icon = sanitizeIcon(s.icon);
      state.picker.color = sanitizeColor(s.color);
      state.lastName = String(s.name || '').slice(0, NAME_MAX);
      if (s.dateKey === state.todayKey && s.voteId) state.myVoteId = String(s.voteId);
    } catch (e) { /* 壊れたデータは無視 */ }
  }

  // ════════════════════════════════════
  // 掃除: KEEP_DAYS より古い日付キーを削除
  // （誰かが開くたびに自動でかたづく方式・cron なし）
  // セキュリティルールは $roomId 単位のため nitaku_rooms 直下の一覧は読めない。
  // 存在する日付は _meta/days/{key} のインデックスで管理する
  // ════════════════════════════════════
  function registerDay(key) {
    db.ref(`nitaku_rooms/_meta/days/${key}`).set(true).catch((e) => {
      console.warn('[meta] register failed', e);
    });
  }

  async function cleanupOldDays() {
    try {
      const cutoff = shiftKey(state.todayKey, -(KEEP_DAYS + 1)); // これ以前（含む）は削除対象
      const snap = await db.ref('nitaku_rooms/_meta/days').once('value');
      const days = snap.val() || {};
      const updates = {};
      Object.keys(days).forEach((key) => {
        if (key <= cutoff) {
          updates[key] = null;
          updates[`_meta/days/${key}`] = null;
        }
      });
      if (Object.keys(updates).length > 0) {
        await db.ref('nitaku_rooms').update(updates);
      }
    } catch (e) {
      console.warn('[cleanup] failed', e);
    }
  }

  // ════════════════════════════════════
  // 日付の表示・ナビ
  // ════════════════════════════════════
  function dayLabel(key) {
    const [, m, d] = key.split('-');
    let suffix = '';
    if (key === state.todayKey) suffix = '（きょう）';
    else if (key === shiftKey(state.todayKey, -1)) suffix = '（きのう）';
    return `${Number(m)}月${Number(d)}日${suffix}`;
  }

  function updateDayNav() {
    els.daynavLabel.textContent = dayLabel(state.viewKey);
    const minKey = shiftKey(state.todayKey, -KEEP_DAYS);
    els.btnPrev.disabled = state.viewKey <= minKey;
    els.btnNext.disabled = state.viewKey >= state.todayKey;
  }

  // ════════════════════════════════════
  // 表示する日の切りかえ
  // ════════════════════════════════════
  function detachVotesListener() {
    if (state.votesRef && state.votesListener) {
      state.votesRef.off('value', state.votesListener);
    }
    state.votesRef = null;
    state.votesListener = null;
  }

  function showDay(key) {
    detachVotesListener();
    state.viewKey = key;
    state.votes = {};
    state.loaded = false;

    const topic = topicForDate(key);
    els.topicLabel.textContent = isViewingToday() ? 'きょうの2たく' : 'この日の2たく';
    els.topicLead.textContent = topic.t;
    const labels = areaLabels(key);
    for (let i = 0; i < 4; i++) {
      document.getElementById(`area-label-${i + 1}`).textContent = labels[i];
      const areaEl = document.querySelector(`.nb-area[data-area="${i + 1}"]`);
      areaEl.setAttribute('aria-label', `${i + 1}番 ${labels[i]}`);
    }

    els.bannerReadonly.hidden = isViewingToday();
    els.loading.hidden = false;
    els.board.hidden = true;
    updateDayNav();

    const votesRef = db.ref(`nitaku_rooms/${key}/votes`);
    if (isViewingToday()) {
      state.votesRef = votesRef;
      state.votesListener = votesRef.on('value', (snap) => {
        if (state.viewKey !== key) return;
        state.votes = snap.val() || {};
        state.loaded = true;
        renderBoard();
      }, (e) => {
        console.warn('[votes] listener error', e);
        RoomkRTDB.showToast('よみこみに失敗したよ。少しまってためしてね');
      });
    } else {
      votesRef.once('value').then((snap) => {
        if (state.viewKey !== key) return;
        state.votes = snap.val() || {};
        state.loaded = true;
        renderBoard();
      }).catch((e) => {
        console.warn('[votes] load error', e);
        RoomkRTDB.showToast('よみこみに失敗したよ。少しまってためしてね');
      });
    }
  }

  // ════════════════════════════════════
  // ボード描画
  // 人数・パーセント・多い方の強調は出さない（ならんでいるだけ）
  // ════════════════════════════════════
  function stampHtml(id, vote, mine) {
    const icon = esc(sanitizeIcon(vote.icon));
    const color = sanitizeColor(vote.color); // 許可リストの固定値のみ通す
    const name = esc(displayName(vote.name));
    const mineClass = mine ? ' nb-stamp--mine' : '';
    return `<button type="button" class="nb-stamp${mineClass}" data-id="${esc(id)}" aria-label="${name}のスタンプ">`
      + `<span class="nb-stamp__chip" style="background:${color}1F">`
      + `<span class="material-symbols-rounded" style="color:${color}">${icon}</span></span>`
      + `<span class="nb-stamp__name">${name}</span></button>`;
  }

  function renderBoard() {
    if (!state.loaded) return;

    // 自分のスタンプが（メンター削除などで）消えていたら忘れる
    if (isViewingToday() && state.myVoteId && !state.votes[state.myVoteId]) {
      state.myVoteId = null;
      saveSession();
    }

    const byArea = { 1: [], 2: [], 3: [], 4: [] };
    Object.entries(state.votes).forEach(([id, vote]) => {
      const area = Number(vote && vote.area);
      if (!byArea[area]) return; // 不正な area は表示しない
      byArea[area].push([id, vote]);
    });

    const today = isViewingToday();
    const full = today && votesCount() >= MAX_VOTES;
    const mine = today ? state.myVoteId : null;

    for (let n = 1; n <= 4; n++) {
      byArea[n].sort((x, y) => (Number(x[1].createdAt) || 0) - (Number(y[1].createdAt) || 0));
      const parts = byArea[n].map(([id, vote]) => stampHtml(id, vote, id === mine));
      const stampsEl = document.getElementById('area-stamps-' + n);
      stampsEl.innerHTML = parts.join('');
    }

    document.querySelectorAll('.nb-area__hint').forEach((el) => {
      el.hidden = !today || full || !!mine;
    });
    els.bannerFull.hidden = !full;
    els.moveHint.hidden = !mine;
    els.loading.hidden = true;
    els.board.hidden = false;
  }

  // ════════════════════════════════════
  // エリアタップ（おく / おひっこし）
  // ════════════════════════════════════
  function onAreaTap(n) {
    if (!state.loaded || !(n >= 1 && n <= 4)) return;
    if (!isViewingToday()) {
      RoomkRTDB.showToast('まえの日はみるだけだよ', false);
      return;
    }
    const myVote = state.myVoteId ? state.votes[state.myVoteId] : null;
    if (myVote) {
      if (Number(myVote.area) === n) {
        openDetail(state.myVoteId);
      } else {
        moveVote(n);
      }
      return;
    }
    if (votesCount() >= MAX_VOTES) {
      RoomkRTDB.showToast('きょうはまんいん！また明日', false);
      return;
    }
    openPicker(n);
  }

  async function moveVote(n) {
    const id = state.myVoteId;
    const dayKey = state.todayKey;
    try {
      await db.ref(`nitaku_rooms/${dayKey}/votes/${id}`)
        .transaction((v) => (v ? { ...v, area: n } : v));
      RoomkRTDB.showToast('スタンプがおひっこししたよ', false);
    } catch (e) {
      console.warn('[move] failed', e);
      RoomkRTDB.showToast('うごかせなかったよ。もういちどためしてね');
    }
  }

  // ════════════════════════════════════
  // スタンプピッカー
  // ════════════════════════════════════
  function renderPickerChoices() {
    const iconHtml = ICONS.map((i) =>
      `<button type="button" class="nb-picker__icon${i.name === state.picker.icon ? ' selected' : ''}"`
      + ` data-icon="${esc(i.name)}" aria-label="${esc(i.label)}" aria-pressed="${i.name === state.picker.icon}">`
      + `<span class="material-symbols-rounded">${esc(i.name)}</span></button>`,
    ).join('');
    els.pickerIcons.innerHTML = iconHtml;

    const colorHtml = COLORS.map((c) =>
      `<button type="button" class="nb-picker__color${c.hex === state.picker.color ? ' selected' : ''}"`
      + ` data-color="${esc(c.hex)}" style="background:${sanitizeColor(c.hex)}"`
      + ` aria-label="${esc(c.label)}" aria-pressed="${c.hex === state.picker.color}"></button>`,
    ).join('');
    els.pickerColors.innerHTML = colorHtml;

    els.pickerPreviewChip.style.background = state.picker.color + '1F';
    els.pickerPreviewIcon.style.color = state.picker.color;
    els.pickerPreviewIcon.textContent = state.picker.icon;
  }

  function openPicker(n) {
    state.pendingArea = n;
    els.pickerAreaNum.textContent = NUMBERS[n - 1];
    els.pickerAreaLabel.textContent = `「${areaLabels(state.todayKey)[n - 1]}」にスタンプをおく`;
    els.inputName.value = state.lastName;
    els.inputComment.value = '';
    renderPickerChoices();
    els.modalPicker.hidden = false;
  }

  function closePicker() {
    els.modalPicker.hidden = true;
    state.pendingArea = null;
  }

  async function placeVote() {
    const area = state.pendingArea;
    if (!area || !isViewingToday()) { closePicker(); return; }

    // 保存時にも必ず切り詰める（maxlength だけに頼らない）
    const name = els.inputName.value.trim().slice(0, NAME_MAX);
    const comment = els.inputComment.value.trim().slice(0, COMMENT_MAX);
    const vote = {
      area,
      icon: sanitizeIcon(state.picker.icon),
      color: sanitizeColor(state.picker.color),
      name,
      comment,
      createdAt: RoomkRTDB.now(),
    };

    const dayKey = state.todayKey;
    const votesRef = db.ref(`nitaku_rooms/${dayKey}/votes`);
    const id = votesRef.push().key;
    els.btnPlace.disabled = true;
    try {
      // 上限チェックと追加を同じ transaction で行う
      const { committed } = await votesRef.transaction((votes) => {
        if (votes && Object.keys(votes).length >= MAX_VOTES) return; // まんいん → abort
        return { ...(votes || {}), [id]: vote };
      });
      closePicker();
      if (!committed) {
        RoomkRTDB.showToast('きょうはまんいん！また明日', false);
        return;
      }
      if (dayKey === state.todayKey) {
        state.myVoteId = id;
        state.lastName = name;
        saveSession();
        renderBoard(); // リスナーの再描画は myVoteId セット前に走るため、ここで描き直す
      }
      RoomkRTDB.showToast('スタンプをおいたよ', false);
    } catch (e) {
      console.warn('[place] failed', e);
      RoomkRTDB.showToast('おけなかったよ。もういちどためしてね');
    } finally {
      els.btnPlace.disabled = false;
    }
  }

  // ════════════════════════════════════
  // スタンプのくわしくモーダル
  // ════════════════════════════════════
  function openDetail(id) {
    const vote = state.votes[id];
    if (!vote) return;
    state.detailId = id;

    const color = sanitizeColor(vote.color);
    els.detailChip.style.background = color + '1F';
    els.detailIcon.style.color = color;
    els.detailIcon.textContent = sanitizeIcon(vote.icon);
    els.detailName.textContent = displayName(vote.name);

    const area = Number(vote.area);
    const labels = areaLabels(state.viewKey);
    els.detailArea.textContent = (area >= 1 && area <= 4)
      ? `${NUMBERS[area - 1]} ${labels[area - 1]}` : '';

    const comment = String(vote.comment || '').slice(0, COMMENT_MAX);
    els.detailComment.textContent = comment || 'ひとことはなし';
    els.detailComment.classList.toggle('nb-detail__comment--empty', !comment);

    const isMine = isViewingToday() && id === state.myVoteId;
    els.btnDelete.hidden = !(isMine || (IS_MENTOR && isViewingToday()));
    els.modalDetail.hidden = false;
  }

  function closeDetail() {
    els.modalDetail.hidden = true;
    state.detailId = null;
  }

  async function deleteDetailVote() {
    const id = state.detailId;
    if (!id || !isViewingToday()) { closeDetail(); return; }
    els.btnDelete.disabled = true;
    try {
      await db.ref(`nitaku_rooms/${state.todayKey}/votes/${id}`).remove();
      if (id === state.myVoteId) {
        state.myVoteId = null;
        saveSession();
      }
      closeDetail();
      RoomkRTDB.showToast('スタンプをけしたよ', false);
    } catch (e) {
      console.warn('[delete] failed', e);
      RoomkRTDB.showToast('けせなかったよ。もういちどためしてね');
    } finally {
      els.btnDelete.disabled = false;
    }
  }

  // ════════════════════════════════════
  // 日付またぎチェック（開きっぱなし対策）
  // ════════════════════════════════════
  function checkDayRollover() {
    const key = dateKeyFromMs(RoomkRTDB.now());
    if (key === state.todayKey) return;
    const wasViewingToday = isViewingToday();
    state.todayKey = key;
    state.myVoteId = null;
    saveSession();
    registerDay(key);
    if (wasViewingToday) {
      showDay(key);
    } else {
      updateDayNav();
    }
    cleanupOldDays();
  }

  // ════════════════════════════════════
  // イベント
  // ════════════════════════════════════
  els.board.addEventListener('click', (e) => {
    const stamp = e.target.closest('.nb-stamp');
    if (stamp) {
      openDetail(stamp.dataset.id);
      return;
    }
    const area = e.target.closest('.nb-area');
    if (area) onAreaTap(Number(area.dataset.area));
  });
  els.board.addEventListener('keydown', (e) => {
    if (e.key !== 'Enter' && e.key !== ' ') return;
    const area = e.target.closest('.nb-area');
    if (area) {
      e.preventDefault();
      onAreaTap(Number(area.dataset.area));
    }
  });

  els.btnPrev.addEventListener('click', () => {
    const key = shiftKey(state.viewKey, -1);
    if (key >= shiftKey(state.todayKey, -KEEP_DAYS)) showDay(key);
  });
  els.btnNext.addEventListener('click', () => {
    const key = shiftKey(state.viewKey, 1);
    if (key <= state.todayKey) showDay(key);
  });

  els.pickerIcons.addEventListener('click', (e) => {
    const btn = e.target.closest('.nb-picker__icon');
    if (!btn) return;
    state.picker.icon = sanitizeIcon(btn.dataset.icon);
    renderPickerChoices();
  });
  els.pickerColors.addEventListener('click', (e) => {
    const btn = e.target.closest('.nb-picker__color');
    if (!btn) return;
    state.picker.color = sanitizeColor(btn.dataset.color);
    renderPickerChoices();
  });

  els.btnPlace.addEventListener('click', placeVote);
  els.btnDelete.addEventListener('click', deleteDetailVote);
  document.querySelectorAll('[data-close="picker"]').forEach((el) => el.addEventListener('click', closePicker));
  document.querySelectorAll('[data-close="detail"]').forEach((el) => el.addEventListener('click', closeDetail));

  // ════════════════════════════════════
  // 起動
  // ════════════════════════════════════
  window.addEventListener('load', async () => {
    if (IS_MENTOR) els.mentorChip.hidden = false;
    await authReady;
    try {
      // サーバー時刻オフセットの取得を待ってから日付を決める
      await db.ref('.info/serverTimeOffset').once('value');
    } catch (e) {
      console.warn('[boot] serverTimeOffset', e);
    }
    state.todayKey = dateKeyFromMs(RoomkRTDB.now());
    restoreSession();
    registerDay(state.todayKey);
    showDay(state.todayKey);
    cleanupOldDays();
    state.dayCheckInterval = setInterval(checkDayRollover, 60 * 1000);
  });
</script>
</body>
</html>
