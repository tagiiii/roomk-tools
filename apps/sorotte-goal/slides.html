<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>説明スライド | そろってゴール | あそびのたな</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@48,500,1,0" rel="stylesheet" />
<style>
  :root{
    --ink:#434343; --ink-soft:#6B6B6B; --paper:#FAFAFA; --white:#FFFFFF;
    --line:#E6E6E6; --muted:#9A9A9A;
    --teal:#00A77F; --coral:#E06666; --blue:#3C78D8; --blue-soft:#6D9EEB;
    --red:#E0574F; --neutral:#C2B69E; --trap:#3A3A3A;
    --acc:var(--teal); --acc-tint:#E3F4EF;
    --font:"Zen Kaku Gothic New", -apple-system, "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, sans-serif;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ height:100%; }
  body{ font-family:var(--font); color:var(--ink); background:#E9ECEF; overflow:hidden; -webkit-font-smoothing:antialiased; }
  .material-symbols-rounded{ font-family:"Material Symbols Rounded"; line-height:1; }
  ruby rt{ font-size:.42em; font-weight:700; color:var(--acc); letter-spacing:0; transform:translateY(2px); }

  /* accent themes（スライドごとに切替） */
  .accent-teal { --acc:var(--teal); --acc-tint:#E2F4EF; }
  .accent-coral{ --acc:var(--coral);--acc-tint:#FBEBEB; }
  .accent-blue { --acc:var(--blue); --acc-tint:#E7EEFB; }

  /* ===================== 発表（デッキ） ===================== */
  #deck{ position:fixed; inset:0; }
  #stage{
    position:absolute; top:50%; left:50%; width:1280px; height:720px;
    transform-origin:center center; background:var(--paper);
    border-radius:18px; box-shadow:0 28px 70px rgba(0,0,0,.35); overflow:hidden;
  }
  .slide{
    position:absolute; inset:0; display:flex; flex-direction:column;
    padding:56px 72px 76px; opacity:0; visibility:hidden;
    transition:opacity .3s ease, transform .3s ease; transform:translateY(10px);
  }
  .slide.active{ opacity:1; visibility:visible; transform:none; }

  /* セクションヘッダー（日本語＋小さな英語キャプション） */
  .sec{ display:flex; align-items:baseline; gap:14px; }
  .sec__jp{ font-size:30px; font-weight:900; color:var(--ink); letter-spacing:.01em; }
  .sec__en{ font-size:18px; font-weight:700; color:var(--acc); letter-spacing:.12em; }
  .sec__num{ display:inline-flex; align-items:center; justify-content:center; min-width:30px; height:30px; padding:0 8px;
    border-radius:8px; background:var(--acc); color:#fff; font-size:18px; font-weight:900; margin-right:2px; }

  .headline{ font-size:46px; font-weight:900; color:var(--ink); line-height:1.32; margin-top:22px; letter-spacing:.005em; }
  .headline .hl{ color:var(--acc); }
  .headline .ul{ background:linear-gradient(transparent 62%, var(--acc-tint) 62%); padding:0 2px; }
  .body{ margin-top:30px; flex:1; min-height:0; }

  /* 役割カード／チーム */
  .cols{ display:grid; grid-template-columns:1fr 1fr; gap:24px; height:100%; }
  .panel{ background:var(--white); border:1.5px solid var(--line); border-radius:18px; padding:26px 28px; display:flex; flex-direction:column; gap:14px; }
  .panel--red{ border-color:#F0CFCB; background:linear-gradient(180deg,#FDF1F0,#fff); }
  .panel--blue{ border-color:#CBDAF4; background:linear-gradient(180deg,#EEF3FD,#fff); }
  .team-head{ display:flex; align-items:center; gap:14px; }
  .team-ic{ width:56px; height:56px; border-radius:50%; display:flex; align-items:center; justify-content:center; color:#fff; }
  .team-ic .material-symbols-rounded{ font-size:34px; }
  .red-bg{ background:var(--red); } .blue-bg{ background:var(--blue); } .teal-bg{ background:var(--teal); } .coral-bg{ background:var(--coral); } .gray-bg{ background:var(--neutral); } .trap-bg{ background:var(--trap); }
  .team-name{ font-size:28px; font-weight:900; color:var(--ink); }
  .role-row{ display:flex; gap:12px; align-items:flex-start; }
  .role-row .material-symbols-rounded{ font-size:26px; color:var(--acc); flex:none; margin-top:3px; }
  .role-row b{ font-size:23px; font-weight:900; color:var(--ink); }
  .role-row .d{ font-size:19px; color:var(--ink-soft); display:block; margin-top:2px; line-height:1.5; }

  /* 箇条書き行 */
  .rows{ display:flex; flex-direction:column; gap:16px; }
  .row{ display:flex; gap:18px; align-items:flex-start; background:var(--white); border:1.5px solid var(--line); border-radius:16px; padding:20px 24px; }
  .row__ic{ flex:none; width:48px; height:48px; border-radius:12px; background:var(--acc-tint); color:var(--acc); display:flex; align-items:center; justify-content:center; }
  .row__ic .material-symbols-rounded{ font-size:28px; }
  .row__t{ font-size:25px; font-weight:900; color:var(--ink); line-height:1.4; }
  .row__d{ font-size:20px; color:var(--ink-soft); margin-top:3px; line-height:1.5; }

  /* 5×5 盤面 */
  .board-wrap{ display:flex; gap:34px; align-items:center; height:100%; }
  .board{ display:grid; grid-template-columns:repeat(5,1fr); gap:9px; flex:none; }
  .cell{ width:104px; height:62px; border-radius:9px; background:#FFFDF7; border:1.5px solid #E7E0CE;
    display:flex; align-items:center; justify-content:center; font-size:18px; font-weight:700; color:#5A5142;
    box-shadow:0 1px 0 rgba(0,0,0,.04); }
  .cell.blue{ background:#E7EEFB; border-color:#9FBCEF; color:var(--blue); }
  .cell.red{ background:#FBE7E5; border-color:#EDA8A2; color:var(--red); }
  .cell.neutral{ background:#F0EADD; border-color:#D8CBB0; color:#8A7B5C; }
  .cell.trap{ background:#3A3A3A; border-color:#222; color:#fff; }
  .cell.trap .material-symbols-rounded{ font-size:26px; }
  .board-legend{ flex:1; display:flex; flex-direction:column; gap:14px; }
  .leg{ display:flex; gap:13px; align-items:center; }
  .leg__sw{ width:34px; height:34px; border-radius:8px; flex:none; border:1.5px solid rgba(0,0,0,.08); }
  .leg__t{ font-size:21px; font-weight:700; color:var(--ink); }
  .leg__t span{ font-size:17px; font-weight:500; color:var(--ink-soft); }

  /* ヒント例カード */
  .hint-demo{ display:flex; flex-direction:column; gap:22px; align-items:flex-start; }
  .hint-card{ display:inline-flex; align-items:center; gap:0; border-radius:18px; overflow:hidden; box-shadow:0 8px 22px rgba(0,0,0,.1); }
  .hint-card .word{ background:var(--white); border:2.5px solid var(--acc); border-right:none; padding:22px 40px; font-size:42px; font-weight:900; color:var(--ink); border-radius:18px 0 0 18px; }
  .hint-card .num{ background:var(--acc); color:#fff; padding:22px 34px; font-size:42px; font-weight:900; min-width:96px; text-align:center; }
  .hint-mean{ font-size:24px; color:var(--ink-soft); line-height:1.6; }
  .hint-mean b{ color:var(--acc); font-weight:900; }

  /* 画面の例（ツール一覧と同じ画面例の絵）と、その横の説明 */
  .shot-wrap{ display:flex; gap:34px; align-items:center; height:100%; }
  .shot{ flex:none; height:100%; max-height:400px; aspect-ratio:1 / 1; border-radius:16px; border:1.5px solid var(--line); box-shadow:0 8px 22px rgba(0,0,0,.1); object-fit:cover; }
  .shot-wrap .rows{ flex:1; }
  /* ひとことの言葉の札 */
  .says{ display:flex; flex-wrap:wrap; gap:10px; margin-top:18px; }
  .say{ background:var(--white); border:2px solid var(--acc); border-radius:999px; padding:8px 18px; font-size:21px; font-weight:700; color:var(--ink); }

  /* Q&A */
  .qa{ display:flex; flex-direction:column; gap:16px; }
  .qa__item{ background:var(--white); border:1.5px solid var(--line); border-radius:16px; padding:18px 24px; }
  .qa__q{ display:flex; gap:13px; align-items:flex-start; font-size:23px; font-weight:900; color:var(--ink); }
  .qa__a{ display:flex; gap:13px; align-items:flex-start; font-size:21px; color:var(--ink-soft); margin-top:8px; line-height:1.5; }
  .qa__badge{ flex:none; width:34px; height:34px; border-radius:9px; display:flex; align-items:center; justify-content:center; color:#fff; font-weight:900; font-size:19px; }
  .qa__badge.q{ background:var(--blue); } .qa__badge.a{ background:var(--coral); }

  /* タイトルスライド */
  .title-slide{ align-items:center; justify-content:center; text-align:center; padding-bottom:76px; }
  .title-ic{ width:118px; height:118px; border-radius:32px; background:var(--teal); color:#fff; display:flex; align-items:center; justify-content:center; box-shadow:0 16px 34px rgba(0,167,127,.32); }
  .title-ic .material-symbols-rounded{ font-size:72px; }
  .title-jp{ font-size:74px; font-weight:900; color:var(--ink); margin-top:24px; letter-spacing:.02em; }
  .title-en{ font-size:22px; font-weight:700; color:var(--teal); letter-spacing:.34em; margin-top:6px; text-transform:lowercase; }
  .title-tag{ font-size:26px; font-weight:700; color:var(--ink-soft); margin-top:22px; }
  .title-meta{ display:flex; gap:12px; margin-top:26px; }
  .title-meta .m{ display:inline-flex; align-items:center; gap:7px; background:var(--white); border:1.5px solid var(--line); border-radius:999px; padding:9px 18px; font-size:18px; font-weight:700; color:var(--ink); }
  .title-meta .material-symbols-rounded{ font-size:20px; color:var(--teal); }

  /* セクション区切り（divider） */
  .divider{ align-items:center; justify-content:center; text-align:center; padding-bottom:76px; background:var(--acc-tint); }
  .divider .d-ic{ width:104px; height:104px; border-radius:50%; background:var(--acc); color:#fff; display:flex; align-items:center; justify-content:center; box-shadow:0 14px 30px rgba(0,0,0,.14); }
  .divider .d-ic .material-symbols-rounded{ font-size:62px; }
  .divider .d-jp{ font-size:72px; font-weight:900; color:var(--ink); margin-top:26px; letter-spacing:.03em; }
  .divider .d-en{ font-size:21px; font-weight:700; color:var(--acc); letter-spacing:.28em; margin-top:8px; text-transform:lowercase; }
  .divider .d-sub{ font-size:24px; font-weight:700; color:var(--ink-soft); margin-top:20px; }
  /* 強調（ゲームスタート等） */
  .divider.solid{ background:var(--acc); }
  .divider.solid .d-ic{ background:rgba(255,255,255,.16); }
  .divider.solid .d-jp,.divider.solid .d-sub{ color:#fff; }
  .divider.solid .d-en{ color:rgba(255,255,255,.85); }

  /* フッター */
  .footer{ position:absolute; left:0; right:0; bottom:0; height:56px; display:flex; align-items:center; justify-content:space-between;
    padding:0 30px; background:rgba(255,255,255,.7); border-top:1px solid var(--line); }
  .brand{ display:flex; align-items:center; gap:9px; font-weight:900; color:var(--ink); font-size:19px; }
  .brand .material-symbols-rounded{ color:var(--teal); font-size:24px; }
  .dots{ display:flex; gap:7px; flex-wrap:wrap; max-width:620px; justify-content:center; }
  .dot{ width:9px; height:9px; border-radius:50%; background:var(--line); transition:.2s; }
  .dot.on{ background:var(--teal); transform:scale(1.3); }
  .counter{ font-size:18px; font-weight:900; color:var(--muted); font-variant-numeric:tabular-nums; }
  .divider .footer,.divider.solid .footer{ background:rgba(255,255,255,.55); }

  /* ナビ矢印 */
  .nav{ position:absolute; top:50%; transform:translateY(-50%); z-index:5; width:54px; height:54px; border-radius:50%; border:none; cursor:pointer;
    background:rgba(67,67,67,.1); color:var(--ink); display:flex; align-items:center; justify-content:center; transition:.2s; opacity:0; }
  #stage:hover .nav{ opacity:.5; } .nav:hover{ opacity:1 !important; background:rgba(67,67,67,.2); }
  .nav .material-symbols-rounded{ font-size:32px; } .nav.prev{ left:16px; } .nav.next{ right:16px; }

  /* ツールバー */
  .toolbar{ position:fixed; top:14px; right:16px; z-index:50; display:flex; gap:8px; opacity:.16; transition:.2s; }
  .toolbar:hover{ opacity:1; }
  .tbtn{ display:inline-flex; align-items:center; gap:7px; cursor:pointer; background:rgba(255,255,255,.95); color:var(--ink); border:1px solid var(--line);
    border-radius:999px; padding:9px 15px; font-family:var(--font); font-weight:700; font-size:14px; box-shadow:0 4px 12px rgba(0,0,0,.18); }
  .tbtn:hover{ background:#fff; } .tbtn .material-symbols-rounded{ font-size:19px; color:var(--teal); }
  .hint-help{ position:fixed; bottom:12px; left:16px; z-index:50; color:rgba(255,255,255,.5); font-size:13px; }
  .hint-help kbd{ background:rgba(0,0,0,.18); border-radius:5px; padding:1px 7px; font-family:var(--font); }

  /* ===================== 発表者ビュー ===================== */
  body.presenter{ background:#EEF1F4; overflow:auto; }
  #presenter{ max-width:680px; margin:0 auto; padding:18px 20px 40px; }
  .pv-warn{ background:#FBEBEB; border:1px solid #EFC4C4; color:#B3463F; border-radius:12px; padding:12px 16px; font-size:14px; font-weight:700; display:flex; align-items:center; gap:10px; margin-bottom:16px; }
  .pv-warn .material-symbols-rounded{ font-size:22px; }
  .pv-count{ font-size:14px; font-weight:900; color:var(--muted); font-variant-numeric:tabular-nums; }
  .pv-title{ font-size:26px; font-weight:900; color:var(--ink); line-height:1.3; margin-top:4px; }
  .pv-lead{ font-size:15px; color:var(--teal); font-weight:700; margin-top:4px; letter-spacing:.04em; }
  .pv-card{ background:#fff; border:1px solid var(--line); border-radius:16px; padding:18px; margin-top:18px; box-shadow:0 4px 14px rgba(0,0,0,.05); }
  .pv-card h3{ font-size:14px; font-weight:900; color:var(--teal); display:flex; align-items:center; gap:8px; margin-bottom:12px; }
  .pv-card h3 .material-symbols-rounded{ font-size:18px; }
  #pvNote{ width:100%; min-height:175px; resize:vertical; border:1px solid var(--line); border-radius:12px; padding:14px 16px; font-family:var(--font); font-size:17px; line-height:1.7; color:var(--ink); background:#FBFCFD; }
  #pvNote:focus{ outline:none; border-color:var(--teal); box-shadow:0 0 0 3px rgba(0,167,127,.15); }
  .pv-actions{ display:flex; gap:10px; margin-top:14px; align-items:center; }
  .pv-copy{ flex:1; cursor:pointer; border:none; border-radius:12px; padding:15px; font-family:var(--font); font-size:18px; font-weight:900; color:#fff; background:var(--teal); display:flex; align-items:center; justify-content:center; gap:10px; box-shadow:0 6px 16px rgba(0,167,127,.28); transition:.15s; }
  .pv-copy:active{ transform:translateY(1px); } .pv-copy.done{ background:#1F8F6E; }
  .pv-copy .material-symbols-rounded{ font-size:22px; }
  .pv-reset{ cursor:pointer; border:1px solid var(--line); background:#fff; color:var(--muted); border-radius:12px; padding:15px 16px; font-family:var(--font); font-weight:700; font-size:14px; }
  .pv-reset:hover{ background:#F5F7F9; }
  .pv-nav{ display:flex; gap:10px; margin-top:18px; }
  .pv-nav button{ flex:1; cursor:pointer; border:1px solid var(--line); background:#fff; color:var(--ink); border-radius:12px; padding:14px; font-family:var(--font); font-weight:900; font-size:16px; display:flex; align-items:center; justify-content:center; gap:8px; }
  .pv-nav button:hover{ background:#F5F7F9; } .pv-nav button:disabled{ opacity:.4; cursor:default; }
  .pv-nav .material-symbols-rounded{ font-size:20px; }
  .pv-next{ margin-top:16px; font-size:14px; color:var(--muted); padding:0 4px; } .pv-next b{ color:var(--ink); }
  .pv-conn{ margin-top:14px; font-size:12px; color:var(--muted); text-align:center; }
</style>
</head>
<body>

<div id="deck">
  <div id="stage">
    <button class="nav prev" id="navPrev" aria-label="前へ"><span class="material-symbols-rounded">chevron_left</span></button>
    <button class="nav next" id="navNext" aria-label="次へ"><span class="material-symbols-rounded">chevron_right</span></button>
    <div id="slides"></div>
    <div class="footer">
      <div class="brand"><span class="material-symbols-rounded">flag</span>そろってゴール</div>
      <div class="dots" id="dots"></div>
      <div class="counter" id="counter">1 / 1</div>
    </div>
  </div>
</div>

<div class="toolbar" id="toolbar">
  <button class="tbtn" id="btnPresenter"><span class="material-symbols-rounded">co_present</span>発表者ノート</button>
  <button class="tbtn" id="btnFull"><span class="material-symbols-rounded">fullscreen</span>全画面</button>
</div>
<div class="hint-help">操作: <kbd>←</kbd> <kbd>→</kbd> めくる ・ <kbd>F</kbd> 全画面 ・ <kbd>P</kbd> 発表者ノート</div>

<div id="presenter" style="display:none">
  <div class="pv-warn"><span class="material-symbols-rounded">visibility_off</span>この画面は<strong>共有しないで</strong>ください（あなた専用のメモ）</div>
  <div class="pv-count" id="pvCount">1 / 1</div>
  <div class="pv-title" id="pvTitle"></div>
  <div class="pv-lead" id="pvLead"></div>
  <div class="pv-card">
    <h3><span class="material-symbols-rounded">chat</span>Metalife チャット用メッセージ</h3>
    <textarea id="pvNote" spellcheck="false"></textarea>
    <div class="pv-actions">
      <button class="pv-copy" id="pvCopy"><span class="material-symbols-rounded">content_copy</span>チャットにコピー</button>
      <button class="pv-reset" id="pvReset">元に戻す</button>
    </div>
  </div>
  <div class="pv-nav">
    <button id="pvPrev"><span class="material-symbols-rounded">chevron_left</span>前のスライド</button>
    <button id="pvNext">次のスライド<span class="material-symbols-rounded">chevron_right</span></button>
  </div>
  <div class="pv-next" id="pvNextTitle"></div>
  <div class="pv-conn" id="pvConn">スライド画面と接続中…</div>
</div>

<script>
const row = (icon, title, desc) => `<div class="row"><div class="row__ic"><span class="material-symbols-rounded">${icon}</span></div><div><div class="row__t">${title}</div><div class="row__d">${desc}</div></div></div>`;
const rows = (...items) => `<div class="rows">${items.map((x) => row(x[0], x[1], x[2])).join('')}</div>`;
const role = (icon, title, desc) => `<div class="role-row"><span class="material-symbols-rounded">${icon}</span><div><b>${title}</b><span class="d">${desc}</span></div></div>`;
const qa = (q, a) => `<div class="qa__item"><div class="qa__q"><span class="qa__badge q">Q</span>${q}</div><div class="qa__a"><span class="qa__badge a">A</span>${a}</div></div>`;

const SLIDES = [
  /* 1 */ { type:'divider', accent:'teal', icon:'waving_hand', jp:'チェックイン', en:'check-in',
    sub:'今の気分を、ひとことどうぞ',
    note:'まずはチェックインから！\n今の気分や、最近あったことを、ひとことチャットか声で教えてね\n（そろってゴールの説明は、このあとすぐ！）' },

  /* 2 */ { type:'title', note:'今日は『そろってゴール』。\nみんなでコマを動かして、全員でゴールに入る協力のゲームだよ。\n勝ち負けはなし。みんなでクリアをめざそう！' },

  /* 3 */ { type:'content', accent:'teal', section:'どんなあそび？', sectionEn:'summary',
    headline:'コマを1マスずつ動かして、<br><span class="hl">全員でゴール</span>に入ろう',
    body:`<div class="shot-wrap"><img class="shot" src="../assets/thumbnails/sorotte-goal.png" alt="そろってゴールの画面の例" />${rows(
      ['pets', '自分のコマを動かす', '1人に1つ、番号の付いたコマがあるよ'],
      ['handshake', '1人では進めない', 'とびら・重い箱・カギを、力を合わせてこえていく'],
      ['hourglass_disabled', 'ゆっくりでOK', '時間は決まっていない。勝ち負けもないよ'],
    )}</div>`,
    note:'『そろってゴール』は、みんなでコマを1マスずつ動かして、全員がゴールに入るとクリアのゲーム。\n1人では進めないしかけが出てくるから、声をかけ合ってこえていくよ。\n時間は決まっていないし、勝ち負けもなし。ゆっくり考えてOK！' },

  /* 4 */ { type:'content', accent:'blue', section:'あそびかた', sectionEn:'how to play', num:'1',
    headline:'<span class="hl">自分のコマ</span>を、1マスずつ動かす',
    body: rows(
      ['keyboard_arrow_up', '矢印キーか、画面の矢印のボタンで動かす', '上・下・左・右に1マスずつ。スマホやタブレットは、画面のボタンで'],
      ['person_pin_circle', '自分のコマには「あなた」の印', 'コマと、横の一覧に、同じ番号が出ているよ'],
      ['block', 'かべと、ほかの人のいるマスには入れない', '進めないときは、どうして進めないかが盤の上に出る'],
    ),

/* ===== ウィンドウ間同期 ===== */
const channel = ('BroadcastChannel' in window) ? new BroadcastChannel('sorotte_goal_deck') : null;
function send(msg){ if(channel) channel.postMessage(msg); try{ localStorage.setItem('sgs_msg', JSON.stringify({...msg,_t:Date.now()})); }catch(e){} }
function onMsg(h){ if(channel) channel.onmessage=(e)=>h(e.data); window.addEventListener('storage',(e)=>{ if(e.key==='sgs_msg'&&e.newValue){ try{ h(JSON.parse(e.newValue)); }catch(err){} } }); }
const isPresenter = new URLSearchParams(location.search).get('view')==='presenter';

/* ===== レンダリング ===== */
function slideHTML(s){
  const acc = s.accent ? `accent-${s.accent}` : 'accent-teal';
  if(s.type==='title'){
    return `<section class="slide title-slide accent-teal">
      <div class="title-ic"><span class="material-symbols-rounded">flag</span></div>
      <div class="title-jp">そろってゴール</div>
      <div class="title-en">sorotte goal</div>
      <div class="title-tag">〜 力を合わせて、全員でゴールへ 〜</div>
      <div class="title-meta">
        <span class="m"><span class="material-symbols-rounded">group</span>2〜12人</span>
        <span class="m"><span class="material-symbols-rounded">schedule</span>1ステージ 5〜15分</span>
        <span class="m"><span class="material-symbols-rounded">devices</span>それぞれの端末で</span>
      </div></section>`;
  }
  if(s.type==='divider'){
    return `<section class="slide divider ${acc}${s.solid?' solid':''}">
      <div class="d-ic"><span class="material-symbols-rounded">${s.icon}</span></div>
      <div class="d-jp">${s.jp}</div>
      <div class="d-en">${s.en}</div>
      ${s.sub?`<div class="d-sub">${s.sub}</div>`:''}</section>`;
  }
  // content
  return `<section class="slide ${acc}">
    <div class="sec">${s.num?`<span class="sec__num">${s.num}</span>`:''}<span class="sec__jp">${s.section}</span><span class="sec__en">${s.sectionEn}</span></div>
    <h1 class="headline">${s.headline}</h1>
    <div class="body">${s.body||''}</div></section>`;
}

if(!isPresenter){
  const slidesEl=document.getElementById('slides'), dotsEl=document.getElementById('dots'), counterEl=document.getElementById('counter');
  let idx=0;
  SLIDES.forEach((s)=>{ slidesEl.insertAdjacentHTML('beforeend', slideHTML(s)); const d=document.createElement('span'); d.className='dot'; dotsEl.appendChild(d); });
  const slideEls=[...slidesEl.children], dotEls=[...dotsEl.children];
  function render(){
    slideEls.forEach((el,i)=>el.classList.toggle('active',i===idx));
    dotEls.forEach((el,i)=>el.classList.toggle('on',i===idx));
    counterEl.textContent=`${idx+1} / ${SLIDES.length}`;
    document.getElementById('navPrev').style.visibility=idx===0?'hidden':'visible';
    document.getElementById('navNext').style.visibility=idx===SLIDES.length-1?'hidden':'visible';
  }
  function goTo(n,b=true){ n=Math.max(0,Math.min(SLIDES.length-1,n)); if(n!==idx){ idx=n; render(); } if(b) send({t:'idx',i:idx}); }
  const next=()=>goTo(idx+1), prev=()=>goTo(idx-1);
  document.getElementById('navNext').onclick=next; document.getElementById('navPrev').onclick=prev;
  document.addEventListener('keydown',(e)=>{
    if(['ArrowRight','PageDown',' '].includes(e.key)){ e.preventDefault(); next(); }
    else if(['ArrowLeft','PageUp'].includes(e.key)){ e.preventDefault(); prev(); }
    else if(e.key==='Home'){ e.preventDefault(); goTo(0); }
    else if(e.key==='End'){ e.preventDefault(); goTo(SLIDES.length-1); }
    else if(e.key==='f'||e.key==='F'){ toggleFull(); }
    else if(e.key==='p'||e.key==='P'){ openPresenter(); }
  });
  const stage=document.getElementById('stage');
  function fit(){ const sc=Math.min(window.innerWidth/1280, window.innerHeight/720); stage.style.transform=`translate(-50%,-50%) scale(${sc})`; }
  window.addEventListener('resize',fit); document.addEventListener('fullscreenchange',fit);
  function toggleFull(){ if(!document.fullscreenElement) document.documentElement.requestFullscreen?.(); else document.exitFullscreen?.(); }
  document.getElementById('btnFull').onclick=toggleFull;
  function openPresenter(){ const url=new URL(location.href); url.searchParams.set('view','presenter'); url.hash=''; const w=window.open(url.toString(),'sgs_presenter','width=620,height=800'); if(!w) alert('発表者ノートのウィンドウがブロックされました。\nブラウザのポップアップを許可してから、もう一度お試しください。'); }
  document.getElementById('btnPresenter').onclick=openPresenter;
  onMsg((m)=>{ if(m.t==='goto') goTo(m.i,false); else if(m.t==='hello') send({t:'idx',i:idx}); });
  fit(); render();
}

if(isPresenter){
  document.title = '発表者ノート | そろってゴール | あそびのたな';
  document.body.classList.add('presenter');
  document.getElementById('deck').style.display='none';
  document.getElementById('toolbar').style.display='none';
  document.querySelector('.hint-help').style.display='none';
  document.getElementById('presenter').style.display='block';
  const $=(id)=>document.getElementById(id);
  const elCount=$('pvCount'), elTitle=$('pvTitle'), elLead=$('pvLead'), elNote=$('pvNote'), elNext=$('pvNextTitle'), elConn=$('pvConn');
  const btnCopy=$('pvCopy'), btnReset=$('pvReset'), btnPrev=$('pvPrev'), btnNext=$('pvNext');
  let cur=0; const KEY=(i)=>'sgs_note_'+i;
  function label(s){
    if(s.type==='title') return 'そろってゴール（タイトル）';
    if(s.type==='divider') return s.jp.replace(/[＼／]/g,'').trim()+'（区切り）';
    return `${s.section}${s.num?' '+s.num:''} ／ ${s.sectionEn}`;
  }
  function plain(html){ const d=document.createElement('div'); d.innerHTML=html||''; d.querySelectorAll('rt').forEach(r=>r.remove()); return (d.textContent||'').replace(/\s+/g,' ').trim(); }
  function titleOf(s){
    if(s.type==='title') return 'そろってゴール';
    if(s.type==='divider') return s.jp;
    return plain(s.headline);
  }
  function show(i){
    cur=Math.max(0,Math.min(SLIDES.length-1,i));
    const s=SLIDES[cur];
    elCount.textContent=`${cur+1} / ${SLIDES.length}`;
    elTitle.textContent=titleOf(s);
    elLead.textContent=label(s);
    const saved=localStorage.getItem(KEY(cur));
    elNote.value=(saved!==null)?saved:s.note;
    btnCopy.classList.remove('done');
    btnCopy.innerHTML='<span class="material-symbols-rounded">content_copy</span>チャットにコピー';
    elNext.innerHTML=cur<SLIDES.length-1?`次のスライド → <b>${titleOf(SLIDES[cur+1])}</b>`:'<b>最後のスライドです</b>';
    btnPrev.disabled=cur===0; btnNext.disabled=cur===SLIDES.length-1;
  }
  elNote.addEventListener('input',()=>{ try{ localStorage.setItem(KEY(cur),elNote.value); }catch(e){} });
  async function copyText(t){ try{ await navigator.clipboard.writeText(t); return true; }catch(e){ try{ const ta=document.createElement('textarea'); ta.value=t; ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta); ta.focus(); ta.select(); const ok=document.execCommand('copy'); ta.remove(); return ok; }catch(e2){ return false; } } }
  btnCopy.onclick=async()=>{
    const ok=await copyText(elNote.value);
    if(!ok){ elNote.focus(); elNote.select(); }
    btnCopy.innerHTML=ok?'<span class="material-symbols-rounded">check</span>コピーしました！':'<span class="material-symbols-rounded">keyboard_command_key</span>選択したのでコピーしてください';
    btnCopy.classList.toggle('done',ok);
    setTimeout(()=>{ btnCopy.classList.remove('done'); btnCopy.innerHTML='<span class="material-symbols-rounded">content_copy</span>チャットにコピー'; },2200);
  };
  btnReset.onclick=()=>{ localStorage.removeItem(KEY(cur)); elNote.value=SLIDES[cur].note; };
  function goto(i){ show(i); send({t:'goto',i:cur}); }
  btnPrev.onclick=()=>goto(cur-1); btnNext.onclick=()=>goto(cur+1);
  document.addEventListener('keydown',(e)=>{ if(e.target===elNote) return; if(e.key==='ArrowRight'||e.key===' '){ e.preventDefault(); goto(cur+1); } else if(e.key==='ArrowLeft'){ e.preventDefault(); goto(cur-1); } });
  onMsg((m)=>{ if(m.t==='idx'){ elConn.textContent='スライド画面と接続中 ✓'; show(m.i); } });
  show(0); send({t:'hello'}); setTimeout(()=>send({t:'hello'}),400);
}
</script>
