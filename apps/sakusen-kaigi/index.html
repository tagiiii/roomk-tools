<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
  <title>作戦会議 | あそびのたな</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,1,0" rel="stylesheet" />
  <link rel="stylesheet" href="../shared/css/design-system.css?v=20261107" />
  <link rel="stylesheet" href="style.css?v=20261112b" />
</head>
<body data-genre="talk">

  <!-- ========== はじめの画面 ========== -->
  <section class="screen active" id="screen-top">
    <main class="front">
      <section class="app-entry" aria-labelledby="front-title">
        <div class="app-hero"><img class="app-illust" src="assets/cover.svg" alt="" width="156" height="156" decoding="async" onerror="this.parentNode.remove()" /></div>
        <h1 id="front-title" class="app-title">作戦会議</h1>
        <p class="app-catch">いつもの流れを、ひとつの画面で</p>
        <p class="app-entry__lead">チェックイン、ジブンチェック、今日は何する？、予定の確認、お知らせを順に進めます。子どもは自分の端末のボタンでも、声やチャットでも答えられます。</p>
        <div class="app-entry__actions">
          <button type="button" class="btn btn-primary btn-lg" id="go-create">ルームを作る</button>
          <button type="button" class="btn btn-secondary" id="go-join">ルームに参加する</button>
          <button type="button" class="text-btn" id="go-watch">みんなにみせる画面を開く</button>
        </div>
        <p id="top-error" class="form-error" role="alert" hidden></p>
      </section>
    </main>
  </section>

  <!-- ========== ルームに参加する ========== -->
  <section class="screen" id="screen-join">
    <main class="front">
      <form id="join-form" class="form-card" novalidate>
        <h2 class="form-card__title">ルームに参加する</h2>
        <p id="joinLinkHint" class="form-card__hint" hidden>リンクからひらいたので、ルームコードは入っているよ。名前を入れて「参加する」を押してね。</p>
        <label class="form-label" for="join-name">ニックネーム（8文字まで）</label>
        <input id="join-name" class="form-input" type="text" maxlength="8" autocomplete="off" />
        <label class="form-label" for="join-code">ルームコード（6文字）</label>
        <input id="join-code" class="form-input code-input" type="text" maxlength="12" autocomplete="off" autocapitalize="characters" autocorrect="off" spellcheck="false" />
        <p id="join-error" class="form-error" role="alert" hidden></p>
        <button type="submit" class="btn btn-primary btn-lg">参加する</button>
        <button type="button" class="text-btn" data-back>トップへ戻る</button>
      </form>
    </main>
  </section>

  <!-- ========== みんなにみせる画面を開く ========== -->
  <section class="screen" id="screen-watch-join">
    <main class="front">
      <form id="watch-form" class="form-card" novalidate>
        <h2 class="form-card__title">みんなにみせる画面を開く</h2>
        <p class="form-card__hint">画面共有する窓で開きます。進行役の画面の「みんなにみせる画面を開く」からも開けます。</p>
        <label class="form-label" for="watch-code">ルームコード（6文字）</label>
        <input id="watch-code" class="form-input code-input" type="text" maxlength="12" autocomplete="off" autocapitalize="characters" autocorrect="off" spellcheck="false" />
        <p id="watch-error" class="form-error" role="alert" hidden></p>
        <button type="submit" class="btn btn-primary btn-lg">ひらく</button>
        <button type="button" class="text-btn" data-back>トップへ戻る</button>
      </form>
    </main>
  </section>

  <!-- ========== みんなにみせる画面（?watch=）。16:9 の舞台だけ ========== -->
  <section class="screen" id="screen-watch">
    <main id="watch" class="watch"><div id="watch-wrap" class="sl-wrap"></div></main>
  </section>

  <!-- ========== 進行役の画面（共有しない） ========== -->
  <section class="screen" id="screen-host">
    <div id="host" class="host">
      <header class="h-top">
        <p class="h-top__title zm">作戦会議<small>ルーム</small><b id="h-code"></b></p>
        <button id="btnCopyCode" type="button" class="btn btn-secondary btn-sm">コードをコピー</button>
        <button id="btnCopyLink" type="button" class="btn btn-secondary btn-sm">リンクをコピー</button>
        <button id="btnShowQr" type="button" class="btn btn-secondary btn-sm">QRコードを出す</button>
        <button id="h-watch" type="button" class="btn btn-primary btn-sm">みんなにみせる画面を開く</button>
        <p class="h-top__clock"><span id="h-clock"></span><span id="h-elapsed"></span><span id="h-conn" class="h-conn"></span></p>
        <button id="h-close" type="button" class="h-top__close">ルームを閉じる</button>
      </header>
      <div class="h-grid">
        <nav class="h-flow" aria-label="流れ">
          <h2 class="h-h2">流れ</h2>
          <ol id="h-steps" class="h-steps"></ol>
          <label class="h-check h-check--small"><input id="h-covers" type="checkbox" checked />コーナーの表紙を出す</label>
        </nav>
        <main class="h-main">
          <div id="h-preview" class="sl-wrap"></div>
          <div class="h-bar">
            <button id="h-prev" type="button" class="h-bar__prev"><span class="material-symbols-rounded" aria-hidden="true">arrow_back</span>前の画面</button>
            <p id="h-now" class="h-bar__now"></p>
            <button id="h-next" type="button" class="btn btn-primary btn-lg h-bar__next">次の画面<span class="material-symbols-rounded" aria-hidden="true">arrow_forward</span></button>
          </div>
          <p class="h-chatrow"><button id="h-chat" type="button" class="h-chat"><span class="material-symbols-rounded" aria-hidden="true">content_copy</span><span id="h-chat-label">この画面の文を、チャット用にコピー</span></button></p>
          <section id="h-ops" class="h-ops" aria-label="この画面の操作"></section>
        </main>
        <aside class="h-side">
          <section class="h-box">
            <h2 class="h-h2">参加する人<small id="h-count"></small></h2>
            <ul id="h-people" class="h-people"></ul>
            <form id="h-add" class="h-row">
              <input id="h-add-name" class="form-input" type="text" maxlength="8" autocomplete="off" placeholder="端末のない子の名前" aria-label="足す人の名前" />
              <button type="submit" class="btn btn-secondary">足す</button>
            </form>
            <p id="h-add-error" class="form-error" role="alert" hidden></p>
          </section>
          <section class="h-box">
            <h2 class="h-h2">次回の日</h2>
            <div class="h-row">
              <input id="h-next-date" class="form-input" type="date" aria-label="次回の日付" />
              <input id="h-next-time" class="form-input" type="time" aria-label="次回の時刻" />
            </div>
          </section>
        </aside>
      </div>
    </div>
  </section>

  <!-- ========== 子どもの画面（自分の端末） ========== -->
  <section class="screen" id="screen-guest">
    <div id="guest" class="guest"></div>
    <p class="g-leave"><button id="g-leave" type="button" class="text-btn">退出する</button></p>
  </section>

  <!-- 予定を入れる（押した人の画面にだけ出る） -->
  <dialog id="picker" class="picker" aria-labelledby="picker-title">
    <div class="picker__head">
      <h2 id="picker-title" class="picker__title zm"></h2>
      <button id="picker-x" type="button" class="icon-btn" aria-label="とじる"><span class="material-symbols-rounded" aria-hidden="true">close</span></button>
    </div>
    <ul id="picker-items" class="picker__items"></ul>
    <div id="picker-chips" class="picker__chips"></div>
    <form id="picker-form" class="h-row">
      <input id="picker-text" class="form-input" type="text" maxlength="12" autocomplete="off" placeholder="自分で書く" aria-label="自分で書く" />
      <button type="submit" class="btn btn-secondary">足す</button>
    </form>
    <button id="picker-close" type="button" class="btn btn-primary">できた</button>
  </dialog>

  <!-- おしらせ（ルームが閉じた・進行役の戻りを待つ など） -->
  <div id="overlay" class="overlay" hidden><div class="overlay__card"><h2 id="overlay-title"></h2><p id="overlay-text"></p><button type="button" class="btn btn-secondary" id="overlay-btn">トップへ戻る</button></div></div>

  <script src="https://www.gstatic.com/firebasejs/13.3.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/13.3.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/13.3.0/firebase-database-compat.js"></script>
  <script src="../shared/js/rtdb-utils.js?v=20261005"></script>
  <script src="../shared/js/room-qr.js?v=20261022"></script>
  <script src="../shared/js/stats.js?v=1" defer></script>
  <script src="../shared/js/howto.js"></script>
  <script src="data.js?v=20261112a"></script>
  <script src="app.js?v=20261112b"></script>
  <script>RoomkHowto.init({ title: 'つかいかた', lead: '作戦会議の流れ（チェックイン・ジブンチェック・今日は何する？・予定の確認・お知らせ）を、ひとつのルームで進めるよ。', sections: [
    { heading: '参加する人', items: ['「ルームに参加する」でニックネーム、ルームコード（6文字）の順に入れて「参加する」。リンクからひらいたときは、ルームコードは入っているので名前だけ入れる。', '画面が変わったら、自分の端末で押して答える。声やチャットで答えてもいいし、パスもできる。', '「今日は何する？」は、やりたいものを押すと進行役に伝わる。決めるのは進行役。', '「予定の確認」は、マスを押して予定を入れる。入れたふせんは、つかんで別のマスへ動かせる。', '端末のない子は、進行役が名前を足して代わりに押す。'] },
    { heading: '進行役', items: ['「ルームを作る」を押す。ルームコードは「コードをコピー」、参加用のリンクは「リンクをコピー」でチャットに送れる。スマホやタブレットで入る人には「QRコードを出す」をカメラで読みとってもらう。', '「みんなにみせる画面を開く」で出る窓を画面共有する。進行役の画面は共有しない。', '「次の画面」「前の画面」か、キーボードの矢印キーで進める。「流れ」の名前を押すと、その画面へ移る。', '声やチャットで答えた子の分は、「参加する人」の名前の横の数字を押して入れる。', '「今日は何する？」で使うツールを決めて「○○を開く」を押し、開いたタブでルームを作ると、参加用のリンクが子どもの画面に出る。', '終わったら「ルームを閉じる」。入れた内容は残らない。'] },
  ] });</script>
</body>
</html>
