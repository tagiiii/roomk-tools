<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>さくせん会議 | roomK</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,1,0" rel="stylesheet" />
  <link rel="stylesheet" href="../shared/css/design-system.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="sk-shell">
    <header class="sk-header">
      <div>
        <h1 class="sk-header__title">さくせん会議</h1>
        <p class="sk-header__sub">めあてを決めて、さくせんを立てて、ためして、ふりかえろう</p>
      </div>
      <a class="sk-header__link" href="../">
        <span class="material-symbols-rounded" aria-hidden="true">home</span>
        ツール一覧
      </a>
    </header>

    <nav class="sk-stepper" aria-label="さくせん会議の流れ">
      <ol class="sk-stepper__list" id="stepper"></ol>
    </nav>

    <main class="sk-main">
      <section class="screen" id="screen-start" aria-labelledby="start-title"></section>
      <section class="screen" id="screen-load-confirm" aria-labelledby="load-confirm-title"></section>
      <section class="screen" id="screen-home" aria-labelledby="home-title"></section>
      <section class="screen" id="screen-goal-category" aria-labelledby="goal-category-title"></section>
      <section class="screen" id="screen-goal-example" aria-labelledby="goal-example-title"></section>
      <section class="screen" id="screen-goal-build" aria-labelledby="goal-build-title"></section>
      <section class="screen" id="screen-plan" aria-labelledby="plan-title"></section>
      <section class="screen" id="screen-confirm" aria-labelledby="confirm-title"></section>
      <section class="screen" id="screen-save" aria-labelledby="save-title"></section>
      <section class="screen" id="screen-check-last" aria-labelledby="check-last-title"></section>
      <section class="screen" id="screen-check-rating" aria-labelledby="check-rating-title"></section>
      <section class="screen" id="screen-check-points" aria-labelledby="check-points-title"></section>
      <section class="screen" id="screen-check-next" aria-labelledby="check-next-title"></section>
    </main>
  </div>

  <div class="sk-toast" id="toast" role="status" aria-live="polite"></div>
  <input class="sk-file-input" id="recordFile" type="file" accept="application/json,.json" />

  <script type="module" src="app.js"></script>
  <script src="../shared/js/howto.js"></script>
  <script>
    RoomkHowto.init({
      title: 'つかいかた',
      lead: 'めあてを決めて、さくせんを立てて、次の会議までためして、ふりかえるツール。',
      sections: [
        { heading: 'はじめかた', items: [
          'はじめてのときは「はじめて さくせん会議をする」を押す',
          '2回目からは「前回のファイルをひらく」で、ほぞんしたファイルをえらぶ',
        ] },
        { heading: 'すすめかた', items: [
          '画面にそって、めあてとさくせんを決めていく',
          'ひとつ前にもどりたいときは「← もどる」を押す',
          'ためしたさくせんは、次の会議で「ふりかえる」を押してふりかえる',
        ] },
        { heading: 'おわりかた', items: [
          '「きょうの会議をおわる」を押す',
          '「記録ファイルをダウンロード」でファイルをほぞんする（このアプリはデータをどこにも保存しない）',
        ] },
      ],
    });
  </script>
</body>
</html>
