<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>コトバの技クイズ | room-K</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,1,0" rel="stylesheet" />
  <link rel="stylesheet" href="../shared/css/design-system.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="kw-app">

    <!-- ── TOP（技えらび） ── -->
    <section class="kw-screen" id="screen-top">
      <header class="kw-hero">
        <span class="material-symbols-rounded kw-hero__icon">tips_and_updates</span>
        <h1 class="kw-hero__title">コトバの技クイズ</h1>
        <p class="kw-hero__sub">きょうのゲームで使う「コトバの技」を、先にのぞいてみよう</p>
      </header>

      <section class="kw-panel card">
        <p class="kw-panel__lead">きょうのゲームで使う「コトバの技」を、クイズで先に見てみよう。4問・5分くらい。</p>

        <ul class="kw-panel__notes">
          <li>正解の数は数えません。「そういう見方があるんだ」が1つ持って帰れれば十分。</li>
          <li>答えはチャットに番号（①②③）でも、声でもOK。</li>
        </ul>

        <h2 class="kw-panel__title">きょうの技をえらぶ</h2>
        <div class="kw-groups" id="wazaGroups"></div>

        <p class="kw-panel__foot">答えた内容はどこにも保存されません。</p>
      </section>
    </section>

    <!-- ── クイズ ── -->
    <section class="kw-screen" id="screen-quiz" hidden>
      <div class="kw-quiz">
        <div class="kw-quiz__meta">
          <span class="badge badge-primary" id="quizWazaName"></span>
          <span class="kw-quiz__progress" id="quizProgress"></span>
        </div>

        <section class="kw-question card">
          <p class="kw-question__text" id="questionText" aria-live="polite"></p>
        </section>

        <ul class="kw-choices" id="choicesArea" aria-label="選択肢"></ul>

        <div class="kw-actions">
          <button class="btn btn-ghost btn-sm" id="btnCopyQuestion" type="button">
            <span class="material-symbols-rounded">content_copy</span>
            問題をチャットにコピー
          </button>
        </div>

        <section class="kw-answer card" id="answerCard" hidden aria-live="polite">
          <p class="kw-answer__label">答え</p>
          <p class="kw-answer__text" id="answerText"></p>
          <p class="kw-answer__explanation" id="answerExplanation"></p>
        </section>

        <div class="kw-actions">
          <button class="btn btn-primary btn-lg" id="btnReveal" type="button">
            <span class="material-symbols-rounded">visibility</span>
            答えを見る
          </button>
          <button class="btn btn-primary btn-lg" id="btnNext" type="button" hidden>
            <span class="material-symbols-rounded">arrow_forward</span>
            <span id="btnNextLabel">次へ</span>
          </button>
        </div>

        <div class="kw-actions">
          <button class="kw-quiet-btn" id="btnQuizBack" type="button">技えらびにもどる</button>
        </div>
      </div>
    </section>

    <!-- ── まとめ（橋渡し） ── -->
    <section class="kw-screen" id="screen-summary" hidden>
      <div class="kw-summary card">
        <p class="kw-summary__label">きょうのコトバの技</p>
        <h2 class="kw-summary__name" id="summaryName"></h2>
        <p class="kw-summary__sub" id="summaryLabel"></p>
        <p class="kw-summary__catch" id="summaryCatch"></p>
      </div>

      <section class="kw-games" id="gamesSection">
        <h3 class="kw-games__title">きょうのゲームでつかってみよう</h3>
        <div class="kw-games__list" id="gamesList"></div>
      </section>

      <div class="kw-actions">
        <button class="kw-quiet-btn" id="btnBackTop" type="button">TOPにもどる</button>
      </div>
    </section>

  </main>

  <script src="waza.js"></script>
  <script type="module" src="app.js"></script>
  <script src="../shared/js/stats.js?v=1" defer></script>
  <script src="../shared/js/howto.js"></script>
  <script>
    RoomkHowto.init({
      title: 'つかいかた',
      lead: 'きょうのゲームで使う「コトバの技」を、3択クイズで先にのぞくツール。4問だけ。',
      sections: [
        { heading: 'はじめかた', items: [
          'きょうの技を1つえらぶ',
        ] },
        { heading: 'すすめかた', items: [
          '問題と①②③を読んで、答えだと思う番号をチャットに送る',
          '「答えを見る」を押すと、答えと説明が出る',
          '「次へ」でつぎの問題にすすむ',
        ] },
        { heading: 'おわりかた', text: '4問おわると、きょうの技のまとめが出る。そのままゲームへ進める。「TOPにもどる」で技えらびに戻れる。' },
      ],
    });
  </script>
</body>
</html>
