<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>きもちのことばマップ | room-K</title>
  <!-- Google Fonts（Noto Sans JP）-->
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet" />
  <!-- Material Symbols Rounded（絵文字は使わない）-->
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,1,0" rel="stylesheet" />
  <!-- 共通デザインシステム -->
  <link rel="stylesheet" href="../shared/css/design-system.css" />
  <!-- アプリ固有スタイル -->
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="wrapper">

    <!-- ヘッダー -->
    <header class="km-header">
      <h1 class="km-header__title">きもちのことばマップ</h1>
      <p class="km-header__question">今日の気持ちに近いことばはある？</p>
      <p class="km-header__sub">最近の気持ちでもOK。いくつ選んでもいいし、選ばなくてもいいよ。</p>
    </header>

    <!-- 「選ばない」も正式な答え。ことばチップと同格に置く -->
    <div class="km-noanswer" id="noAnswerRow" role="group" aria-label="選ばないときの答え">
      <button type="button" class="km-noanswer__btn" data-key="wakaranai" aria-pressed="false">わからない</button>
      <button type="button" class="km-noanswer__btn" data-key="doredemo" aria-pressed="false">どれでもない</button>
      <button type="button" class="km-noanswer__btn" data-key="erabanai" aria-pressed="false">今日は選ばない</button>
    </div>

    <!-- えらばない選択を尊重する一言 -->
    <p class="km-gentle" id="gentleMsg" aria-live="polite" hidden></p>

    <!-- 選択パネル（ことばを選んだときだけ表示）-->
    <section class="km-panel" id="selectionPanel" hidden>
      <p class="km-panel__hint">近くのことばもふんわり光ってるよ。こっちのほうが近い？</p>
      <div class="km-panel__rows" id="selectionRows"></div>
      <div class="km-panel__actions">
        <button type="button" class="btn btn-ghost btn-sm" id="btnClear">消す</button>
      </div>
    </section>

    <!-- ことばマップ -->
    <main class="km-map" id="mapArea"></main>

  </div>

  <script type="module" src="app.js"></script>
  <script src="../shared/js/stats.js?v=1" defer></script>
  <script src="../shared/js/howto.js"></script>
  <script>
    RoomkHowto.init({
      title: 'つかいかた',
      lead: '今日の気持ちに近いことばを、マップからさがすツール。ながめるだけでもOK。',
      sections: [
        { heading: 'すすめかた', items: [
          '気持ちに近いことばをタップする（いくつ選んでもOK）',
          '近くのことばがふんわり光ったら、そっちに変えてもOK',
          'ことばの大きさを「小さめ」「ふつう」「大きめ」から選べる（選ばなくてもOK）',
          '「消す」を押すと、いつでも全部消せる',
        ] },
        { heading: '選ばなくてもOK', text: 'ぴったりのことばがなければ、「わからない」「どれでもない」「今日は選ばない」を押してOK。' },
        { heading: 'おわりかた', text: 'そのまま閉じておしまい。選んだことばはどこにも残らない。' },
      ],
    });
  </script>
</body>
</html>
