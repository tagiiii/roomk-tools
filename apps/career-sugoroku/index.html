<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
  <title>キャリアすごろく | room-K</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Zen+Maru+Gothic:wght@500;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400..500,1,0" rel="stylesheet" />
  <link rel="stylesheet" href="../shared/css/design-system.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<!-- ═════ 入口 ═════ -->
<section class="screen" id="screen-top" aria-labelledby="top-title">
  <div class="cs-center">
    <div class="cs-panel">
      <div class="cs-hero">
        <svg class="cs-hero__art" id="hero-art" viewBox="0 0 420 150" role="img" aria-label="まちの道を、カードを集めながら進むイメージ"></svg>
        <div class="cs-title-row">
          <h1 class="cs-title" id="top-title" data-game-title>キャリアすごろく</h1>
        </div>
      </div>
      <p class="cs-lead">まちをめぐって「適性」と「職業」のカードを集め、最後に1つの職業を選ぶすごろく。1〜8人・45分くらい。</p>
      <ul class="cs-points">
        <li><span class="material-symbols-rounded" aria-hidden="true">touch_app</span><span>選ぶだけで進むよ。書いたり、理由を話したりしなくて大丈夫。</span></li>
        <li><span class="material-symbols-rounded" aria-hidden="true">style</span><span>カードはゲームの中の持ち札。本当の向き・不向きとは関係ないよ。</span></li>
        <li><span class="material-symbols-rounded" aria-hidden="true">weekend</span><span>途中で休んだり、見学に回ったりもできるよ。</span></li>
      </ul>
      <div class="cs-stack">
        <button class="cs-btn cs-btn--primary cs-btn--lg cs-btn--full" data-act="goCreate">ルームを作る</button>
        <button class="cs-btn cs-btn--secondary cs-btn--full" data-act="goJoin">ルームに参加する</button>
        <div class="cs-quietrow">
          <button class="cs-quiet" data-act="openGuide"><span class="material-symbols-rounded" aria-hidden="true">menu_book</span>はじめてガイド</button>
          <button class="cs-quiet" data-act="openRules"><span class="material-symbols-rounded" aria-hidden="true">help</span>くわしいルール</button>
        </div>
      </div>
      <p class="cs-foot">ゲームの記録は、ルームを閉じると消えます。</p>
    </div>
  </div>
</section>

<!-- ═════ ルームを作る ═════ -->
<section class="screen" id="screen-create" aria-labelledby="create-title">
  <div class="cs-center">
    <form class="cs-panel" id="form-create" novalidate>
      <h2 class="cs-title" id="create-title" style="font-size:26px;margin-bottom:16px">ルームを作る</h2>
      <div class="cs-field">
        <label for="create-name">ニックネーム（8文字まで）</label>
        <input class="cs-input" id="create-name" maxlength="8" autocomplete="off" />
      </div>
      <div class="cs-field">
        <span class="cs-field__label" id="create-role-label">あなた（ホスト）は</span>
        <div class="cs-seg" role="group" aria-labelledby="create-role-label">
          <button type="button" data-act="createRole" data-v="play" aria-pressed="true">自分も参加する</button>
          <button type="button" data-act="createRole" data-v="host" aria-pressed="false">進行だけする</button>
        </div>
        <p class="cs-help">あとから待合室で変えられます。</p>
      </div>
      <p class="cs-form-error" id="create-error" hidden></p>
      <div class="cs-stack">
        <button class="cs-btn cs-btn--primary cs-btn--full cs-btn--lg" type="submit">ルームを作る</button>
        <button class="cs-quiet" type="button" data-act="goTop">トップへ戻る</button>
      </div>
    </form>
  </div>
</section>

<!-- ═════ ルームに参加する ═════ -->
<section class="screen" id="screen-join" aria-labelledby="join-title">
  <div class="cs-center">
    <form class="cs-panel" id="form-join" novalidate>
      <h2 class="cs-title" id="join-title" style="font-size:26px;margin-bottom:16px">ルームに参加する</h2>
      <div class="cs-field">
        <label for="join-name">ニックネーム（8文字まで）</label>
        <input class="cs-input" id="join-name" maxlength="8" autocomplete="off" />
      </div>
      <div class="cs-field">
        <label for="join-code">ルームコード（6文字）</label>
        <input class="cs-input cs-input--code" id="join-code" maxlength="6" autocomplete="off" autocapitalize="characters" inputmode="text" />
      </div>
      <div class="cs-field">
        <span class="cs-field__label" id="join-role-label">参加のしかた</span>
        <div class="cs-seg" role="group" aria-labelledby="join-role-label">
          <button type="button" data-act="joinRole" data-v="player" aria-pressed="true">ゲームに参加する</button>
          <button type="button" data-act="joinRole" data-v="watch" aria-pressed="false">見学する</button>
        </div>
        <p class="cs-help" id="join-role-help">カードを集めて遊びます。</p>
      </div>
      <p class="cs-form-error" id="join-error" hidden></p>
      <div class="cs-stack">
        <button class="cs-btn cs-btn--primary cs-btn--full cs-btn--lg" type="submit" id="join-submit">参加する</button>
        <button class="cs-quiet" type="button" data-act="goTop">トップへ戻る</button>
      </div>
    </form>
  </div>
</section>

<!-- ═════ 待合室 ═════ -->
<section class="screen" id="screen-lobby" aria-label="待合室">
  <div id="lobby-root"></div>
</section>

<!-- ═════ ゲーム ═════ -->
<section class="screen" id="screen-game" aria-label="ゲーム">
  <div class="cs-game">
    <header class="cs-bar" id="game-bar"></header>
    <div class="cs-main" id="game-main">
      <div class="cs-boardcard" id="board-card">
        <svg class="cs-board" id="board" viewBox="0 0 1000 600" role="img" aria-label="まちの盤面"></svg>
        <div class="cs-legend" id="board-legend"></div>
      </div>
      <section class="cs-stage" id="stage" aria-live="off"></section>
      <section class="cs-card cs-handcard" id="hand" aria-label="カード"></section>
      <section class="cs-card cs-near" id="near" aria-label="近くのマス"></section>
      <section class="cs-card cs-peoplecard" id="people" aria-label="みんなの様子"></section>
    </div>
    <div class="cs-results" id="results" hidden></div>
  </div>
</section>

<!-- 読み上げ用（手番の交代・結果など） -->
<div class="cs-sr" id="live" role="status" aria-live="polite"></div>

<div id="drawer-root"></div>
<div id="modal-root"></div>

<div class="cs-overlay" id="overlay" hidden>
  <div class="cs-overlay__box" role="alertdialog" aria-live="assertive" aria-labelledby="overlay-title">
    <div class="cs-spinner" id="overlay-spinner" aria-hidden="true"></div>
    <p class="cs-notice__title" id="overlay-title">接続を確認しています</p>
    <p class="cs-notice__text" id="overlay-text"></p>
    <button class="cs-btn cs-btn--secondary" id="overlay-btn" data-act="overlayBtn" hidden>トップへ戻る</button>
  </div>
</div>
<div id="toast-root"></div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
<script src="../shared/js/rtdb-utils.js"></script>
<script src="data.js"></script>
<script src="engine.js"></script>
<script src="board.js"></script>
<script src="net.js"></script>
<script src="ui.js"></script>
<script src="../shared/js/stats.js?v=1" defer></script>
<script src="../shared/js/howto.js"></script>
<script>
  RoomkHowto.init({
    title: 'あそびかた',
    lead: 'まちをすごろくでめぐって「適性」と「職業」のカードを集め、最後に1つの職業を選ぶゲームだよ。カードや点数は、ゲームの中だけのもの。',
    sections: [
      { heading: 'はじめかた', items: [
        'ホストが「ルームを作る」を押して、ルームコードを伝える',
        'ほかの人は「ルームに参加する」を押し、ニックネーム → ルームコードの順に入れて「参加する」',
        '端末がない人は、ホストが「端末なしで参加する人を追加」に名前を入れて「追加」。その人の分はホストが押す',
      ] },
      { heading: 'すすめかた', items: [
        '理想の職業・最初の適性カード・当面の目標を選ぶ',
        '自分の番は「サイコロを振る」で進み、止まったマスでやることを選ぶ',
        '最後に、持っている職業から1つを選んで「仕上げのサイコロを振る」',
      ] },
      { heading: 'こまったときは', text: '上の「ガイド」で、はじめてガイドが見られるよ。休みたいときは、自分の番の「今回はスキップ」や「しばらく見学」を押してね。' },
    ],
  });
</script>
</body>
</html>
