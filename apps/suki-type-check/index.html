<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />

  <title>すきタイプチェック | あそびのたな</title>
  <!-- Google Fonts（Noto Sans JP）-->

<body data-genre="talk">
  <div class="stc-shell">
    <header class="stc-header">
      <div>
        <h1 class="stc-header__title">すきタイプチェック</h1>
        <p class="stc-header__sub">18個の質問に答えると、自分の「すき」のタイプがわかる</p>
      </div>
      <a class="stc-header__link" href="../">
        <span class="material-symbols-rounded" aria-hidden="true">home</span>
        ツール一覧
      </a>
    </header>

    <main class="stc-main">
      <section class="screen" id="screen-start" aria-labelledby="start-title"></section>
      <section class="screen" id="screen-question" aria-labelledby="question-title"></section>
      <section class="screen" id="screen-result" aria-labelledby="result-title"></section>
    </main>
  </div>

  <script type="module" src="app.js?v=20261107s4"></script>
  <script src="../shared/js/stats.js?v=1" defer></script>
  <script src="../shared/js/howto.js"></script>
  <script>
    RoomkHowto.init({
      title: 'つかいかた',
      lead: '18個の質問に答えると、自分の「すき」のタイプが出てくる診断ツール。10分くらいで終わるよ。',
      sections: [
        { heading: 'はじめかた', items: [
          '「はじめる」を押すと、1問ずつ質問が出てくる',
        ] },
        { heading: 'すすめかた', items: [
          '「あてはまる」から「当てはまらない」まで、近いものを5つから選ぶ',
          '迷ったときは「どちらでもない」を選んでOK',
          '「ひとつ前にもどる」で、前の質問を選び直せる',
        ] },
        { heading: '結果の見かた', items: [
          'タイプはひとつに決めつけるためのものじゃない。話のきっかけとして見てね',
          '「結果をコピー」で、結果をチャットに貼りつけられる',
        ] },
        { heading: 'おわりかた', text: '「もういちどやる」で、最初からやり直せる。' },
      ],
    });
  </script>
