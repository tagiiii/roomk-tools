<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>トークテーマカード | room-K</title>
  <!-- Google Fonts（Noto Sans JP）-->
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,1,0" rel="stylesheet" />
  <!-- 共通デザインシステム（M-1〜M-6）-->
  <link rel="stylesheet" href="../shared/css/design-system.css" />
  <!-- アプリ固有スタイル -->
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="wrapper">

    <!-- ヘッダー -->
    <header class="tc-header">
      <h1 class="tc-header__title">トークテーマカード</h1>
      <p class="tc-header__sub">気になるカードをクリックしてお題を開こう！</p>
    </header>

    <!-- お題表示エリア（M-5 popIn で出現）-->
    <section class="topic-area" id="topicArea" aria-live="polite">
      <p class="topic-area__label">今日のお題</p>
      <p class="topic-area__text" id="topicText"></p>
      <div class="topic-area__actions">
        <button class="btn btn-primary" id="btnCopy">コピーする</button>
        <button class="btn btn-secondary" id="btnNext">別のカードを引く</button>
      </div>
    </section>

    <!-- カードグリッド（M-4 カードフリップ）-->
    <div class="card-grid" id="cardGrid"></div>

    <!-- 引き直しエリア -->
    <div class="redraw-area" id="redrawArea">
      <button class="btn btn-ghost" id="btnRedraw">3枚引き直す</button>
    </div>

    <!-- プール残数 -->
    <p class="pool-info" id="poolInfo"></p>

  </div>

  <script type="module" src="app.js"></script>
  <script src="../shared/js/stats.js?v=1" defer></script>
  <script src="../shared/js/howto.js"></script>
  <script>
    RoomkHowto.init({
      title: 'あそびかた',
      lead: '3枚のカードから好きな1枚を選んで、出てきたお題をきっかけにおしゃべりするツール。',
      sections: [
        { heading: 'はじめかた', items: ['気になるカードを1枚クリックする'] },
        {
          heading: 'すすめかた',
          items: [
            '出てきたお題について、みんなでおしゃべりする',
            '「コピーする」を押すと、お題をチャットに貼りつけられる',
            '「別のカードを引く」を押すと、新しい3枚が出てくる',
          ],
        },
        { heading: 'おわりかた', text: '好きなタイミングで終わってOK。とくに操作はいらない。' },
      ],
    });
  </script>
</body>
</html>
