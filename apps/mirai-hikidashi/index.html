<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>みらいの引き出し | roomK</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,1,0" rel="stylesheet" />
  <link rel="stylesheet" href="../shared/css/design-system.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="mh-shell">
    <header class="mh-header">
      <div>
        <h1 class="mh-header__title">みらいの引き出し</h1>
        <p class="mh-header__sub">せかいの入口を、すこしずつ のぞいてみるところ</p>
      </div>
      <a class="mh-header__link" href="../">
        <span class="material-symbols-rounded" aria-hidden="true">home</span>
        ツール一覧
      </a>
    </header>

    <main class="mh-main">
      <section class="screen" id="screen-shelf" aria-labelledby="shelf-title"></section>
      <section class="screen" id="screen-drawer" aria-labelledby="drawer-title"></section>
    </main>
  </div>

  <div class="mh-toast" id="toast" role="status" aria-live="polite"></div>

  <script type="module" src="app.js"></script>
  <script src="../shared/js/howto.js"></script>
  <script>
    RoomkHowto.init({
      title: 'つかいかた',
      lead: 'いろんな「せかいの入口」を、すこしずつ のぞいてみるところ。ぜんぶ見なくて だいじょうぶ。',
      sections: [
        { heading: 'はじめかた', items: [
          '気になる入口をおす（「どれか ひとつ ひらいてみる」でもOK）',
        ] },
        { heading: 'すすめかた', items: [
          '中を読んだら、「のぞいてみる」「あとで見る」「今はいい」のどれかをおす。どれをえらんでもいいよ',
          '「いちらんにもどる」をおすと、ほかの入口も見られる（えらばなくてもOK）',
          'えらんだ反応は、あとから いつでも かえられるよ',
        ] },
        { heading: 'おわりかた', text: 'すきなタイミングでおわってOK。「ファイルにのこす」をおすと、気になった入口をファイルにのこせるよ（のこさなくてもOK）。' },
      ],
    });
  </script>
</body>
</html>
