<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>みらいの引き出し | room-K</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,1,0" rel="stylesheet" />
  <link rel="stylesheet" href="../shared/css/design-system.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="mh-shell">
    <header class="mh-header">
      <div>
        <h1 class="mh-header__title">みらいの引き出し</h1>
        <p class="mh-header__sub">世界の入口を、少しずつのぞいてみるところ</p>
      </div>
      <a class="mh-header__link" href="../">
        <span class="material-symbols-rounded" aria-hidden="true">home</span>
        ツール一覧
      </a>
    </header>

    <main class="mh-main">
      <section class="screen" id="screen-shelf" aria-labelledby="shelf-title"></section>
      <section class="screen" id="screen-drawer" aria-labelledby="drawer-title"></section>
    </main>
  </div>

  <div class="mh-toast" id="toast" role="status" aria-live="polite"></div>

  <script type="module" src="app.js"></script>
  <script src="../shared/js/stats.js?v=1" defer></script>
  <script src="../shared/js/howto.js"></script>
  <script>
    RoomkHowto.init({
      title: 'つかいかた',
      lead: 'いろんな「世界の入口」を、少しずつのぞいてみるところ。全部見なくて大丈夫。',
      sections: [
        { heading: 'はじめかた', items: [
          '気になる入口を押す（「どれかひとつ開いてみる」でもOK）',
        ] },
        { heading: 'すすめかた', items: [
          '中を読んだら、「のぞいてみる」「あとで見る」「今はいい」のどれかを押す。どれを選んでもいいよ',
          '「一覧にもどる」を押すと、ほかの入口も見られる（選ばなくてもOK）',
          '選んだ反応は、あとからいつでも変えられるよ',
        ] },
        { heading: 'おわりかた', text: '好きなタイミングで終わってOK。「ファイルに残す」を押すと、気になった入口をファイルに残せるよ（残さなくてもOK）。' },
      ],
    });
  </script>
</body>
</html>
