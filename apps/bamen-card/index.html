<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ばめんカード | roomK</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,1,0" rel="stylesheet" />
  <link rel="stylesheet" href="../shared/css/design-system.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="bm-shell">
    <header class="bm-header">
      <div>
        <h1 class="bm-header__title">ばめんカード</h1>
        <p class="bm-header__sub">「ばめん」をひとつ えらんで、ゆっくり話してみるカード</p>
      </div>
      <a class="bm-header__link" href="../">
        <span class="material-symbols-rounded" aria-hidden="true">home</span>
        ツール一覧
      </a>
    </header>

    <main class="bm-main">
      <section class="screen" id="screen-mode" aria-labelledby="mode-title"></section>
      <section class="screen" id="screen-talk" aria-labelledby="talk-title"></section>
    </main>
  </div>

  <script type="module" src="app.js"></script>
  <script src="../shared/js/howto.js"></script>
  <script>
    RoomkHowto.init({
      title: 'あそびかた',
      lead: '「ばめん」をひとつ えらんで、カードの といかけを きっかけに ゆっくり話すあそび。',
      sections: [
        { heading: 'はじめかた', items: [
          '①〜④のモードから、きょうの気分に合うものを えらぶ',
          '「まず」のところで、話す ばめんを ひとつ きめる',
        ] },
        { heading: 'すすめかた', items: [
          '「入口カードを引く」を押して、といかけに こたえながら話す',
          'こたえたくない ときは パスして、「べつの入口カードを引く」を押す',
          '主人公カードは「べつの主人公にする」で かえられる',
          'モードは「← モードを えらびなおす」で いつでも かえられる',
        ] },
        { heading: 'おわりかた', text: 'すきな タイミングで おわって OK。カード1まいだけでも じゅうぶん。' },
      ],
    });
  </script>
</body>
</html>
