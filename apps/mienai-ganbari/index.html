<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>みえないがんばり | room-K</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,1,0" rel="stylesheet" />
  <link rel="stylesheet" href="../shared/css/design-system.css" />
  <style>
    body {
      background: var(--color-bg);
      padding-bottom: 170px; /* ← 下部の葉っぱエリア分 */
    }

    @media (max-width: 600px) {
      body { padding-bottom: 140px; }
    }

    .mg-wrapper {
      max-width: 760px;
      margin-inline: auto;
      padding: var(--space-lg) var(--space-md) var(--space-md);
    }

    /* ── ヘッダー ── */
    .mg-header {
      text-align: center;
      margin-bottom: var(--space-lg);
    }

    .mg-header__title {
      font-size: var(--font-size-xl);
      font-weight: 700;
      color: var(--color-primary);
      letter-spacing: 0.02em;
    }

    .mg-header__ask {
      margin-top: var(--space-sm);
      font-size: var(--font-size-lg);
      color: var(--color-primary);
      font-weight: 500;
    }

    .mg-header__hint {
      margin-top: var(--space-xs);
      font-size: var(--font-size-sub);
      color: var(--color-muted);
      line-height: 1.6;
    }

    /* ── カテゴリ ── */
    .mg-cat {
      background: var(--color-surface);
      border-radius: var(--radius-card);
      box-shadow: var(--shadow-sm);
      padding: var(--space-md);
      margin-bottom: var(--space-md);
    }

    .mg-cat__title {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: var(--font-size-body);
      font-weight: 700;
      color: var(--color-primary);
      margin-bottom: var(--space-sm);
    }

    .mg-cat__title .material-symbols-rounded {
      font-size: 22px;
      color: var(--color-accent);
    }

    .mg-cat__list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .mg-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 8px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: background-color var(--transition-base);
      -webkit-tap-highlight-color: transparent;
    }

    .mg-item:hover {
      background: #F7F4ED;
    }

    .mg-item__check {
      position: absolute;
      width: 1px;
      height: 1px;
      opacity: 0;
      pointer-events: none;
    }

    .mg-item__box {
      width: 22px;
      height: 22px;
      border-radius: 6px;
      border: 2px solid var(--color-border);
      background: var(--color-surface);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: background-color var(--transition-base), border-color var(--transition-base);
    }

    .mg-item__box .material-symbols-rounded {
      font-size: 16px;
      color: #fff;
      opacity: 0;
      transition: opacity var(--transition-base);
    }

    .mg-item__text {
      flex: 1;
      font-size: var(--font-size-body);
      color: var(--color-text);
      line-height: 1.5;
      transition: color var(--transition-base);
    }

    .mg-item[data-checked="true"] .mg-item__box {
      background: #7BA37A;
      border-color: #7BA37A;
    }

    .mg-item[data-checked="true"] .mg-item__box .material-symbols-rounded {
      opacity: 1;
    }

    .mg-item[data-checked="true"] .mg-item__text {
      color: var(--color-muted);
    }

    /* ── 自分のことば ── */
    .mg-custom__row {
      display: flex;
      gap: var(--space-sm);
      margin-bottom: var(--space-sm);
    }

    .mg-custom__input {
      flex: 1;
      padding: 10px 12px;
      border: 2px solid var(--color-border);
      border-radius: var(--radius-btn);
      font-family: var(--font-base);
      font-size: var(--font-size-body);
      background: var(--color-surface);
      transition: border-color var(--transition-base);
    }

    .mg-custom__input:focus {
      outline: none;
      border-color: var(--color-accent);
    }

    .mg-custom__add {
      flex-shrink: 0;
    }

    .mg-custom__list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .mg-item__remove {
      width: 28px;
      height: 28px;
      border: none;
      background: transparent;
      color: var(--color-muted);
      border-radius: var(--radius-full);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: background-color var(--transition-base), color var(--transition-base);
      opacity: 0.6;
    }

    .mg-item__remove:hover {
      background: #F1E5E5;
      color: var(--color-error);
      opacity: 1;
    }

    .mg-item__remove .material-symbols-rounded {
      font-size: 18px;
    }

    /* ── フッター ── */
    .mg-footer {
      text-align: center;
      margin-top: var(--space-lg);
    }

    /* ── 葉っぱエリア（画面下部に固定） ── */
    .mg-pile {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      height: 160px;
      pointer-events: none;
      overflow: hidden;
      z-index: 10;
      background: linear-gradient(
        to top,
        rgba(238, 233, 220, 0.95) 0%,
        rgba(238, 233, 220, 0.85) 40%,
        rgba(238, 233, 220, 0) 100%
      );
    }

    @media (max-width: 600px) {
      .mg-pile { height: 130px; }
    }

    /* 地面のぼんやりした影 */
    .mg-pile::before {
      content: '';
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 6px;
      background: linear-gradient(to top, rgba(120, 100, 70, 0.08), transparent);
    }

    .mg-leaf {
      position: absolute;
      width: 32px;
      height: 32px;
      will-change: transform, opacity;
      transform: translate(var(--end-x, 0), var(--end-y, 0)) rotate(var(--end-rot, 0deg));
      filter: drop-shadow(0 2px 2px rgba(60, 50, 30, 0.10));
    }

    .mg-leaf--falling {
      animation: mg-leaf-fall 1100ms cubic-bezier(0.32, 0.72, 0.45, 1) forwards;
    }

    @keyframes mg-leaf-fall {
      0% {
        transform: translate(var(--start-x), var(--start-y)) rotate(var(--start-rot, -10deg)) scale(0.7);
        opacity: 0;
      }
      25% {
        opacity: 1;
      }
      55% {
        transform: translate(
          calc((var(--start-x) + var(--end-x)) / 2 + var(--drift, 12px)),
          calc((var(--start-y) + var(--end-y)) / 2)
        ) rotate(var(--mid-rot, 18deg)) scale(0.95);
      }
      100% {
        transform: translate(var(--end-x), var(--end-y)) rotate(var(--end-rot)) scale(1);
        opacity: 1;
      }
    }

    .mg-leaf--leaving {
      animation: mg-leaf-leave 350ms ease-out forwards;
    }

    @keyframes mg-leaf-leave {
      from {
        transform: translate(var(--end-x), var(--end-y)) rotate(var(--end-rot)) scale(1);
        opacity: 1;
      }
      to {
        transform: translate(var(--end-x), calc(var(--end-y) + 20px)) rotate(var(--end-rot)) scale(0.6);
        opacity: 0;
      }
    }

    /* ── レスポンシブ ── */
    @media (max-width: 600px) {
      .mg-wrapper {
        padding: var(--space-md) 12px var(--space-sm);
      }
      .mg-header__title { font-size: 22px; }
      .mg-header__ask { font-size: 18px; }
      .mg-cat { padding: var(--space-sm) 12px; }
      .mg-item { padding: 10px 4px; gap: 10px; }
      .mg-leaf { width: 26px; height: 26px; }
    }
  </style>
</head>
<body>

  <div class="mg-wrapper">

    <header class="mg-header">
      <h1 class="mg-header__title">みえないがんばり</h1>
      <p class="mg-header__ask">最近、こんなことあった？</p>
      <p class="mg-header__hint">あてはまるものを、そっとタップ。<br>葉っぱが下にひらりと落ちていきます。</p>
    </header>

    <div id="mgCategories"></div>

    <section class="mg-cat" aria-labelledby="mgCustomTitle">
      <h2 class="mg-cat__title" id="mgCustomTitle">
        <span class="material-symbols-rounded" aria-hidden="true">edit_note</span>
        自分のことば
      </h2>
      <div class="mg-custom__row">
        <input
          type="text"
          class="mg-custom__input"
          id="mgCustomInput"
          aria-label="じぶんの がんばりを ついか"
          placeholder="ほかにもあれば書いてみよう"
          maxlength="40"
          autocomplete="off"
        />
        <button class="btn btn-secondary mg-custom__add" id="mgCustomAdd" type="button">
          ふやす
        </button>
      </div>
      <ul class="mg-custom__list" id="mgCustomList"></ul>
    </section>

    <footer class="mg-footer">
      <button class="btn btn-ghost btn-sm" id="mgReset" type="button">
        <span class="material-symbols-rounded" aria-hidden="true">restart_alt</span>
        そっとリセット
      </button>
    </footer>

  </div>

  <div class="mg-pile" id="mgPile" aria-hidden="true"></div>

  <script>
    // ─────────────────────────────────────────────
    // データ
    // ─────────────────────────────────────────────
    const CATEGORIES = [
      {
        id: 'people',
        label: '人といるとき',
        icon: 'groups',
        items: [
          { id: 'p1', text: 'ともだちのテンションに合わせた' },
          { id: 'p2', text: 'しらない子と話した' },
          { id: 'p3', text: '「やだな」と思ったけど言わなかった' },
          { id: 'p4', text: 'みんなのペースに合わせて動いた' },
        ],
      },
      {
        id: 'outside',
        label: '外に出たとき',
        icon: 'park',
        items: [
          { id: 'o1', text: '朝おきて出かけた' },
          { id: 'o2', text: 'にぎやかな場所にいた' },
          { id: 'o3', text: '電車やバスに乗った' },
          { id: 'o4', text: 'ふだん行かない場所に行った' },
        ],
      },
      {
        id: 'home',
        label: '家で',
        icon: 'home',
        items: [
          { id: 'h1', text: 'きょうだいに気を使った' },
          { id: 'h2', text: 'おうちの人のきげんに合わせた' },
          { id: 'h3', text: 'いやだったけど手伝った' },
          { id: 'h4', text: '静かにしているようにした' },
        ],
      },
      {
        id: 'feeling',
        label: '自分の気持ち',
        icon: 'favorite',
        items: [
          { id: 'f1', text: 'イライラを表に出さなかった' },
          { id: 'f2', text: '泣きたいのをこらえた' },
          { id: 'f3', text: '大丈夫なふりをした' },
          { id: 'f4', text: 'つかれているのに動いた' },
        ],
      },
    ];

    const LEAF_COLORS = [
      { fill: '#8FB97A', vein: '#5E8A55' },
      { fill: '#A8C26F', vein: '#6B8A47' },
      { fill: '#6FA86A', vein: '#3E6A3D' },
      { fill: '#C9CE89', vein: '#8A8E5A' },
      { fill: '#7CA489', vein: '#4D7560' },
      { fill: '#B5C28C', vein: '#7E8B5C' },
    ];

    const LEAF_PATHS = [
      'M16 3 C 6 8, 4 18, 8 28 C 17 29, 27 22, 28 11 C 26 5, 21 3, 16 3 Z',
      'M16 4 C 24 4, 29 12, 26 20 C 21 27, 12 26, 7 21 C 4 13, 9 5, 16 4 Z',
      'M16 2 C 23 9, 24 19, 16 30 C 8 19, 9 8, 16 2 Z',
    ];

    const STORAGE_KEY = 'mienai-ganbari:v1';

    // ─────────────────────────────────────────────
    // 状態
    // ─────────────────────────────────────────────
    const state = {
      // チェック状態: { itemId: true }
      checked: {},
      // 自由入力アイテム: [{ id, text }]
      customs: [],
      // 葉っぱのプロパティ: { itemId: { ex, ey, rot, variant, color } }
      // ex/ey は mg-pile からの相対座標、画面右下を基準にしたピクセル位置
      leaves: {},
    };

    // ─────────────────────────────────────────────
    // ユーティリティ
    // ─────────────────────────────────────────────
    function escHtml(s) {
      return String(s)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;')
        .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function randInt(min, max) {
      return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    function randChoice(arr) {
      return arr[Math.floor(Math.random() * arr.length)];
    }

    function load() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return;
        const v = JSON.parse(raw);
        if (v && typeof v === 'object') {
          state.checked = (v.checked && typeof v.checked === 'object') ? v.checked : {};
          state.customs = Array.isArray(v.customs) ? v.customs.filter(c => c && c.id && typeof c.text === 'string') : [];
          state.leaves = (v.leaves && typeof v.leaves === 'object') ? v.leaves : {};
        }
      } catch {}
    }

    let saveTimer = null;
    function save() {
      clearTimeout(saveTimer);
      saveTimer = setTimeout(() => {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify({
            checked: state.checked,
            customs: state.customs,
            leaves: state.leaves,
          }));
        } catch {}
      }, 150);
    }

    // ─────────────────────────────────────────────
    // 葉っぱ
    // ─────────────────────────────────────────────
    function buildLeafSvg(variant, color) {
      const path = LEAF_PATHS[variant % LEAF_PATHS.length];
      const c = LEAF_COLORS[color % LEAF_COLORS.length];
      // 葉脈の中央線 (簡易)
      return `
        <svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <path d="${path}" fill="${c.fill}" />
          <path d="M16 4 Q 14 16, 11 26" stroke="${c.vein}" stroke-width="0.8" fill="none" stroke-linecap="round" opacity="0.55" />
        </svg>
      `;
    }

    function makeLeafProps() {
      const pile = document.getElementById('mgPile');
      const rect = pile.getBoundingClientRect();
      const padX = 24;
      const padBottom = 8;
      // y: 下から 0〜70px の範囲（地面側に寄せる）
      const ex = randInt(padX, Math.max(padX + 1, rect.width - padX - 32));
      const ey = rect.height - 32 - padBottom - randInt(0, 70);
      const rot = randInt(-40, 40);
      const variant = randInt(0, LEAF_PATHS.length - 1);
      const color = randInt(0, LEAF_COLORS.length - 1);
      return { ex, ey, rot, variant, color };
    }

    function spawnLeaf(itemId, opts = {}) {
      const pile = document.getElementById('mgPile');
      const leafEl = document.createElement('div');
      leafEl.className = 'mg-leaf';
      leafEl.dataset.itemId = itemId;

      const props = state.leaves[itemId];
      if (!props) return;
      leafEl.innerHTML = buildLeafSvg(props.variant, props.color);

      // CSS variables - final position
      leafEl.style.setProperty('--end-x', props.ex + 'px');
      leafEl.style.setProperty('--end-y', props.ey + 'px');
      leafEl.style.setProperty('--end-rot', props.rot + 'deg');

      if (opts.animate) {
        // チェックボックスの位置から落とす
        const checkbox = document.querySelector(`.mg-item[data-item-id="${itemId}"] .mg-item__box`);
        const pileRect = pile.getBoundingClientRect();
        let startX = props.ex;
        let startY = -120;
        if (checkbox) {
          const cb = checkbox.getBoundingClientRect();
          startX = cb.left - pileRect.left;
          startY = cb.top - pileRect.top;
        }
        leafEl.style.setProperty('--start-x', startX + 'px');
        leafEl.style.setProperty('--start-y', startY + 'px');
        leafEl.style.setProperty('--start-rot', randInt(-15, 15) + 'deg');
        leafEl.style.setProperty('--mid-rot', randInt(-30, 30) + 'deg');
        leafEl.style.setProperty('--drift', randInt(-20, 20) + 'px');
        leafEl.classList.add('mg-leaf--falling');
        leafEl.addEventListener('animationend', () => {
          leafEl.classList.remove('mg-leaf--falling');
        }, { once: true });
      }

      pile.appendChild(leafEl);
    }

    function removeLeaf(itemId, animate) {
      const leafEl = document.querySelector(`.mg-leaf[data-item-id="${itemId}"]`);
      if (!leafEl) return;
      if (animate) {
        leafEl.classList.add('mg-leaf--leaving');
        leafEl.addEventListener('animationend', () => leafEl.remove(), { once: true });
      } else {
        leafEl.remove();
      }
    }

    function renderAllLeaves() {
      const pile = document.getElementById('mgPile');
      pile.innerHTML = '';
      Object.keys(state.checked).forEach(itemId => {
        if (state.checked[itemId] && state.leaves[itemId]) {
          spawnLeaf(itemId, { animate: false });
        }
      });
    }

    // ─────────────────────────────────────────────
    // チェック切り替え
    // ─────────────────────────────────────────────
    function toggleItem(itemId) {
      const willCheck = !state.checked[itemId];
      state.checked[itemId] = willCheck;
      if (willCheck) {
        // 既存の葉っぱを再利用せず、毎回新しい位置を割り当てる
        state.leaves[itemId] = makeLeafProps();
        spawnLeaf(itemId, { animate: true });
      } else {
        removeLeaf(itemId, true);
        delete state.leaves[itemId];
      }
      updateItemUI(itemId);
      save();
    }

    function updateItemUI(itemId) {
      const row = document.querySelector(`.mg-item[data-item-id="${itemId}"]`);
      if (!row) return;
      row.setAttribute('data-checked', state.checked[itemId] ? 'true' : 'false');
      const input = row.querySelector('.mg-item__check');
      if (input) input.checked = !!state.checked[itemId];
    }

    // ─────────────────────────────────────────────
    // 描画
    // ─────────────────────────────────────────────
    function createItemElement(item) {
      const li = document.createElement('li');
      const isChecked = !!state.checked[item.id];

      const label = document.createElement('label');
      label.className = 'mg-item';
      label.setAttribute('data-item-id', item.id);
      label.setAttribute('data-checked', isChecked ? 'true' : 'false');

      const input = document.createElement('input');
      input.type = 'checkbox';
      input.className = 'mg-item__check';
      input.checked = isChecked;
      input.addEventListener('change', () => toggleItem(item.id));

      const box = document.createElement('span');
      box.className = 'mg-item__box';
      box.setAttribute('aria-hidden', 'true');
      const check = document.createElement('span');
      check.className = 'material-symbols-rounded';
      check.textContent = 'check';
      box.appendChild(check);

      const text = document.createElement('span');
      text.className = 'mg-item__text';
      text.textContent = item.text;

      label.appendChild(input);
      label.appendChild(box);
      label.appendChild(text);

      if (item.removable) {
        const rm = document.createElement('button');
        rm.className = 'mg-item__remove';
        rm.type = 'button';
        rm.setAttribute('aria-label', 'この項目を消す');
        const rmIcon = document.createElement('span');
        rmIcon.className = 'material-symbols-rounded';
        rmIcon.setAttribute('aria-hidden', 'true');
        rmIcon.textContent = 'close';
        rm.appendChild(rmIcon);
        rm.addEventListener('click', (e) => {
          e.preventDefault();
          e.stopPropagation();
          removeCustom(item.id);
        });
        label.appendChild(rm);
      }

      li.appendChild(label);
      return li;
    }

    function renderCategories() {
      const wrap = document.getElementById('mgCategories');
      wrap.innerHTML = '';
      CATEGORIES.forEach(cat => {
        const section = document.createElement('section');
        section.className = 'mg-cat';

        const title = document.createElement('h2');
        title.className = 'mg-cat__title';
        title.innerHTML = `
          <span class="material-symbols-rounded" aria-hidden="true">${escHtml(cat.icon)}</span>
          ${escHtml(cat.label)}
        `;
        section.appendChild(title);

        const ul = document.createElement('ul');
        ul.className = 'mg-cat__list';
        cat.items.forEach(item => {
          ul.appendChild(createItemElement(item));
        });
        section.appendChild(ul);
        wrap.appendChild(section);
      });
    }

    function renderCustoms() {
      const ul = document.getElementById('mgCustomList');
      ul.innerHTML = '';
      state.customs.forEach(c => {
        ul.appendChild(createItemElement({ id: c.id, text: c.text, removable: true }));
      });
    }

    // ─────────────────────────────────────────────
    // 自由入力
    // ─────────────────────────────────────────────
    function addCustom() {
      const input = document.getElementById('mgCustomInput');
      const text = (input.value || '').trim();
      if (!text) return;
      const id = 'c_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
      state.customs.push({ id, text });
      input.value = '';
      renderCustoms();
      save();
    }

    function removeCustom(id) {
      const idx = state.customs.findIndex(c => c.id === id);
      if (idx < 0) return;
      // チェック済みだった場合は葉っぱも消す
      if (state.checked[id]) {
        removeLeaf(id, true);
        delete state.checked[id];
        delete state.leaves[id];
      }
      state.customs.splice(idx, 1);
      renderCustoms();
      save();
    }

    function bindCustom() {
      document.getElementById('mgCustomAdd').addEventListener('click', addCustom);
      document.getElementById('mgCustomInput').addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          e.preventDefault();
          addCustom();
        }
      });
    }

    // ─────────────────────────────────────────────
    // リセット
    // ─────────────────────────────────────────────
    function bindReset() {
      document.getElementById('mgReset').addEventListener('click', () => {
        if (!confirm('全部のチェックと葉っぱを消しますか？')) return;
        state.checked = {};
        state.customs = [];
        state.leaves = {};
        document.getElementById('mgPile').innerHTML = '';
        renderCategories();
        renderCustoms();
        save();
      });
    }

    // ─────────────────────────────────────────────
    // リサイズ時の葉っぱ位置再計算
    // ─────────────────────────────────────────────
    let resizeTimer = null;
    function bindResize() {
      window.addEventListener('resize', () => {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(() => {
          // 既存の葉っぱ位置を pile の幅に合わせて clamp
          const pile = document.getElementById('mgPile');
          const rect = pile.getBoundingClientRect();
          Object.keys(state.leaves).forEach(id => {
            const p = state.leaves[id];
            const maxX = Math.max(24, rect.width - 24 - 32);
            if (p.ex > maxX) {
              p.ex = randInt(24, maxX);
              const el = document.querySelector(`.mg-leaf[data-item-id="${id}"]`);
              if (el) el.style.setProperty('--end-x', p.ex + 'px');
            }
          });
          save();
        }, 150);
      });
    }

    // ─────────────────────────────────────────────
    // 起動
    // ─────────────────────────────────────────────
    load();
    renderCategories();
    renderCustoms();
    renderAllLeaves();
    bindCustom();
    bindReset();
    bindResize();
  </script>
