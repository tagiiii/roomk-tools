<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>え!? 実は○○なんですかゲーム | あそびのたな</title>
  <!-- Google Fonts（Noto Sans JP）-->
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&display=swap" rel="stylesheet" />
  <!-- Material Symbols Rounded (FILL=1) -->
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,1,0" rel="stylesheet" />
  <!-- 共通デザインシステム（M-1〜M-6）-->
  <link rel="stylesheet" href="../shared/css/design-system.css?v=20261106" />
  <!-- アプリ固有スタイル -->
  <link rel="stylesheet" href="style.css?v=20261106look" />
</head>
<body data-genre="suiri">

  <div class="wrapper">

    <!-- ヘッダー -->
    <header class="jitsuwa-hero">
      <div class="app-hero app-hero--compact"><img class="app-illust" src="../assets/illustrations/jitsuwa-game.webp" alt="" width="92" height="92" decoding="async" onerror="this.parentNode.remove()" /></div>
      <h1 class="jitsuwa-hero__title app-title">え!? 実は○○なんですかゲーム</h1>
      <p class="jitsuwa-hero__sub">ある人の意外な一面を当てよう！</p>
    </header>

    <!-- プロンプト表示エリア（M-5 popIn で出現）-->
    <section class="prompt-panel" id="promptPanel" aria-live="polite">
      <p class="prompt-panel__label">
        <span class="material-symbols-rounded">tips_and_updates</span>今回のお題！みんなで YES / NO を予想しよう
      </p>
      <p class="prompt-panel__text" id="promptText"></p>
      <div class="prompt-panel__actions">
        <button class="btn btn-primary" id="btnCopy" disabled>
          <span class="material-symbols-rounded">content_copy</span>コピー
        </button>
        <button class="btn btn-secondary" id="btnNext">
          <span class="material-symbols-rounded">refresh</span>新しいカードを引く
        </button>
      </div>
    </section>

    <!-- コントロールバー -->
    <div class="control-bar">
      <button class="btn btn-ghost btn-sm" id="btnReset">
        <span class="material-symbols-rounded">replay</span>全カードをリセット
      </button>
      <span class="pool-info" id="poolInfo"></span>
    </div>

    <!-- カードグリッド（M-4 カードフリップ）-->
    <div class="card-grid" id="cardGrid" role="group" aria-label="カード3枚"></div>

    <!-- 引き直しエリア（お題選択前のみ表示）-->
    <div class="redraw-area" id="redrawArea">
      <button class="btn btn-ghost" id="btnRedraw">
        <span class="material-symbols-rounded">casino</span>3枚引き直す
      </button>
    </div>


  </div>

  <script type="module" src="app.js"></script>
  <script src="../shared/js/stats.js?v=1" defer></script>
  <script src="../shared/js/howto.js"></script>
  <script>
    RoomkHowto.init({
      title: 'あそびかた',
      lead: 'ひとりを主役にして、「実は〜？」のお題の答えをみんなで予想するゲーム。答えはYESでもNOでもOK！',
      sections: [
        { heading: 'はじめかた', items: [
          '今回の主役をひとり決める',
          '3枚のカードから、聞いてみたいカードをひとつ選ぶ',
          '聞きたいカードがないときは「3枚引き直す」を押す',
        ] },
        { heading: 'すすめかた', items: [
          'カードをクリックして、お題をみんなに見せる',
          '主役の答えがYESかNOか、みんなで予想して話す',
          '主役が答えを発表したら、気になったことを聞いてみる',
          '「新しいカードを引く」を押して、つぎの主役に交代する',
        ] },
        { heading: 'おわりかた', text: '好きなところでおしまい。「全カードをリセット」を押すと、使ったお題もふくめて最初から引き直せるよ。' },
      ],
    });
  </script>
</body>
</html>
