<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>つよみカード | room-K</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,1,0" rel="stylesheet" />
  <link rel="stylesheet" href="../shared/css/design-system.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="wrapper">

    <!-- TOP（すきタイプチェックと同じパネル1枚構成。説明はモーダル(つかいかた)に一本化） -->
    <div class="screen active" id="screen-top">
      <div class="ty-panel">
        <h1 class="ty-panel__title">つよみカード</h1>
        <p class="ty-panel__lead">「こういうところ、ありそう？」の強みカードが1枚ずつ出てくる。「ある」「ない」「どちらでもない」で答えていくと、最後に「ある」と答えたカードが並ぶ。全部で20枚、5分くらい。</p>
        <ul class="ty-note-list">
          <li>正解はない。ぱっと思ったほうでOK</li>
          <li>まよったときは「どちらでもない」でOK</li>
          <li>とちゅうで「今日はここまで」にしてもOK</li>
        </ul>
        <div class="ty-panel__actions">
          <button class="btn btn-primary btn-lg" id="btn-start">
            <span class="material-symbols-rounded">play_arrow</span>
            はじめる
          </button>
        </div>
        <p class="ty-muted">答えた内容はどこにも保存されない。ページを閉じると消える。</p>
      </div>
    </div>

    <!-- CARD（1枚ずつ提示） -->
    <div class="screen" id="screen-card">
      <header class="ty-header">
        <p class="ty-progress" id="card-progress" aria-hidden="true"></p>
        <h1 class="ty-header__title ty-question">こういうところ、ありそう？</h1>
      </header>

      <div class="ty-stage">
        <span class="material-symbols-rounded ty-stage__icon" id="card-icon" aria-hidden="true"></span>
        <p class="ty-stage__text" id="card-text" tabindex="-1"></p>
      </div>

      <!-- 答えは3択同格（どちらでもない＝まよったとき・答えたくないときの受け皿） -->
      <div class="ty-choice" role="group" aria-label="このカードへの答え">
        <button type="button" class="ty-choice-btn" data-answer="aru" aria-pressed="false">
          <span class="material-symbols-rounded" aria-hidden="true">radio_button_unchecked</span>
          ある
        </button>
        <button type="button" class="ty-choice-btn" data-answer="nai" aria-pressed="false">
          <span class="material-symbols-rounded" aria-hidden="true">close</span>
          ない
        </button>
        <button type="button" class="ty-choice-btn" data-answer="naka" aria-pressed="false">
          <span class="material-symbols-rounded" aria-hidden="true">change_history</span>
          どちらでもない
        </button>
      </div>

      <div class="ty-subactions">
        <button type="button" class="ty-quiet-btn" id="btn-back">
          <span class="material-symbols-rounded" aria-hidden="true">undo</span>
          ひとつ前にもどる
        </button>
        <button type="button" class="ty-quiet-btn" id="btn-finish">
          <span class="material-symbols-rounded" aria-hidden="true">flag</span>
          今日はここまで
        </button>
      </div>
    </div>

    <!-- SUMMARY（まとめ） -->
    <div class="screen" id="screen-summary">
      <header class="ty-header">
        <h1 class="ty-header__title" id="summary-title" tabindex="-1"></h1>
        <p class="ty-header__sub" id="summary-sub"></p>
      </header>

      <div class="ty-summary-cards" id="summary-cards"></div>

      <!-- ボタンは「塗り→枠線→テキスト」の3段階（主アクションは1つだけ） -->
      <div class="ty-actions">
        <button class="btn btn-primary" id="btn-copy">
          <span class="material-symbols-rounded">content_copy</span>
          結果をコピー
        </button>
        <button class="btn btn-secondary" id="btn-resume" hidden>
          <span class="material-symbols-rounded">play_arrow</span>
          カードのつづきを見る
        </button>
        <button type="button" class="ty-quiet-btn" id="btn-restart">
          <span class="material-symbols-rounded" aria-hidden="true">restart_alt</span>
          最初にもどる
        </button>
      </div>
    </div>

  </div>

  <script type="module" src="app.js"></script>
  <script src="../shared/js/stats.js?v=1" defer></script>
  <script src="../shared/js/howto.js"></script>
  <script>
    RoomkHowto.init({
      title: 'つかいかた',
      lead: '自分に「ありそうなところ」を、カードに1枚ずつ答えながら見つけるツール。正解はない。',
      sections: [
        { heading: 'はじめかた', items: [
          '「はじめる」を押す',
          'カードが1枚ずつ出てくる',
          '「ある」「ない」「どちらでもない」で答える',
        ] },
        { heading: 'すすめかた', items: [
          'まよったときや答えたくないときは「どちらでもない」でOK',
          'まちがえたら「ひとつ前にもどる」で答え直せる',
          'とちゅうでも「今日はここまで」でまとめに進める',
        ] },
        { heading: 'おわりかた', text: '最後に「ある」と答えたカードが並ぶ。チャットに残したいときは「結果をコピー」。「最初にもどる」で最初の画面にもどる。' },
      ],
    });
  </script>
</body>
</html>
