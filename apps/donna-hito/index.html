<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>わたし、ぼくってどんな人？ | あそびのたな</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,1,0" rel="stylesheet" />
  <link rel="stylesheet" href="../shared/css/design-system.css?v=20261106" />
  <link rel="stylesheet" href="style.css?v=20261106look" />
</head>
<body data-genre="talk">

  <div class="wrapper">

    <!-- TOP（つよみカードと同じパネル1枚構成） -->
    <div class="screen active" id="screen-top">
      <div class="dh-panel app-entry">
        <div class="app-hero"><img class="app-illust" src="../assets/illustrations/donna-hito.webp" alt="" width="156" height="156" decoding="async" onerror="this.parentNode.remove()" /></div>
        <h1 class="dh-panel__title app-title">わたし、ぼくってどんな人？</h1>
        <p class="dh-panel__lead app-entry__lead">「動くときは？」「予定は？」のような問いが1つずつ出てくる。両はしの言葉のどちらに近いかを、1〜4から選んでいく。答え終わったら、1つずつふりかえって話す。最後に全部の答えが並ぶ。</p>
        <ul class="dh-note-list app-entry__notes">
          <li>正解はない。ぱっと思ったほうでOK</li>
          <li>どちらもいいところがある</li>
          <li>決められないときは「パス」でOK</li>
        </ul>
        <div class="dh-panel__actions app-entry__actions">
          <button class="btn btn-primary btn-lg" id="btn-start">
            <span class="material-symbols-rounded">play_arrow</span>
            はじめる
          </button>
        </div>
      </div>
    </div>

    <!-- QUESTION（1つずつ答える。ふりかえりも同じ画面で1つずつ見る） -->
    <div class="screen" id="screen-question">
      <header class="dh-header">
        <p class="dh-progress" id="q-progress" aria-hidden="true"></p>
        <div class="dh-dots" id="q-dots" aria-hidden="true"></div>
        <h1 class="dh-header__title" id="q-title" tabindex="-1"></h1>
        <p class="dh-header__sub" id="q-sub">どちらに近い？</p>
      </header>

      <div class="dh-stage">
        <div class="dh-ends">
          <div class="dh-end dh-end--left">
            <span class="dh-end__icon"><span class="material-symbols-rounded" id="q-left-icon" aria-hidden="true"></span></span>
            <p class="dh-end__label" id="q-left"></p>
          </div>
          <div class="dh-end dh-end--right">
            <span class="dh-end__icon"><span class="material-symbols-rounded" id="q-right-icon" aria-hidden="true"></span></span>
            <p class="dh-end__label" id="q-right"></p>
          </div>
        </div>
        <div class="dh-scale" role="group" id="q-scale">
          <span class="dh-ring" id="q-ring" aria-hidden="true"></span>
          <button type="button" class="dh-scale__btn" data-value="1" aria-pressed="false"><span class="dh-scale__num">1</span><span class="dh-scale__deg">とても</span></button>
          <button type="button" class="dh-scale__btn" data-value="2" aria-pressed="false"><span class="dh-scale__num">2</span><span class="dh-scale__deg">少し</span></button>
          <button type="button" class="dh-scale__btn" data-value="3" aria-pressed="false"><span class="dh-scale__num">3</span><span class="dh-scale__deg">少し</span></button>
          <button type="button" class="dh-scale__btn" data-value="4" aria-pressed="false"><span class="dh-scale__num">4</span><span class="dh-scale__deg">とても</span></button>
        </div>
        <p class="dh-stage__note" id="q-note" hidden></p>
      </div>

      <div class="dh-actions">
        <button class="btn btn-primary" id="btn-next" disabled>
          <span class="material-symbols-rounded">arrow_forward</span>
          <span id="btn-next-label">つぎへ</span>
        </button>
      </div>

      <div class="dh-subactions">
        <button type="button" class="dh-quiet-btn" id="btn-back">
          <span class="material-symbols-rounded" aria-hidden="true">undo</span>
          <span id="btn-back-label">ひとつ前にもどる</span>
        </button>
        <button type="button" class="dh-quiet-btn" id="btn-skip">
          <span class="material-symbols-rounded" aria-hidden="true">redo</span>
          パス
        </button>
        <button type="button" class="dh-quiet-btn" id="btn-finish">
          <span class="material-symbols-rounded" aria-hidden="true">flag</span>
          今日はここまで
        </button>
      </div>
    </div>

    <!-- SUMMARY（ふりかえりのあとに、全部の答えを一覧で並べる） -->
    <div class="screen" id="screen-summary">
      <header class="dh-header">
        <h1 class="dh-header__title" id="summary-title" tabindex="-1">わたし、ぼくってどんな人？</h1>
        <p class="dh-header__sub">全部の答え。押すと、その問いを大きく出せる</p>
      </header>

      <div class="dh-summary" id="summary-list"></div>

      <!-- ボタンは「塗り→枠線→テキスト」の3段階（主アクションは1つだけ） -->
      <div class="dh-actions dh-actions--stack">
        <button class="btn btn-primary" id="btn-copy">
          <span class="material-symbols-rounded">content_copy</span>
          結果をコピー
        </button>
        <button type="button" class="dh-quiet-btn" id="btn-restart">
          <span class="material-symbols-rounded" aria-hidden="true">restart_alt</span>
          最初にもどる
        </button>
      </div>
    </div>

  </div>

  <script type="module" src="app.js"></script>
  <script src="../shared/js/stats.js?v=1" defer></script>
  <script src="../shared/js/howto.js"></script>
  <script>
    RoomkHowto.init({
      title: 'つかいかた',
      lead: '自分のふだんの動き方や考え方を、両はしの言葉のどちらに近いかで考えてみるツール。正解はない。',
      sections: [
        { heading: 'はじめかた', items: [
          '「はじめる」を押す',
          '問いが1つずつ出てくる',
          '両はしの言葉のどちらに近いかを、1〜4から選んで「つぎへ」',
        ] },
        { heading: 'すすめかた', items: [
          '1と4は「とても」近い、2と3は「少し」近い',
          '決められないときは「パス」でOK',
          'キーボードの1〜4キーでも選べる。Enter で「つぎへ」',
          'まちがえたら「ひとつ前にもどる」で選び直せる',
          'とちゅうでも「今日はここまで」でまとめに進める',
        ] },
        { heading: 'ふりかえり', items: [
          '答え終わると、答えたところを1つずつ見ていく',
          '話してみて気持ちが変わったら、その場で選び直せる',
        ] },
        { heading: 'おわりかた', items: [
          'ふりかえりのあとに、全部の答えが並ぶ',
          '話したい問いを押すと、その問いだけを大きく出せる（選び直しもできる）',
          'チャットに残したいときは「結果をコピー」。「最初にもどる」で最初の画面にもどる',
        ] },
      ],
    });
  </script>
</body>
</html>
