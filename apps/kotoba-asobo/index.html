<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>コトバであそぼ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@48,500,1,0" rel="stylesheet" />
  <link rel="stylesheet" href="../shared/css/design-system.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="ka-app">
  <main id="ka-session-list" class="ka-select" hidden>
    <header class="ka-select__header">
      <div class="ka-select__mark"><span class="material-symbols-rounded">text_fields</span></div>
      <div>
        <p class="ka-select__eyebrow">roomK workshop slides</p>
        <h1 class="ka-select__title">コトバであそぼ</h1>
        <p class="ka-select__lead">国語ワークショップ進行スライドを選んで開始します。</p>
      </div>
    </header>
    <section class="ka-session-grid" id="ka-session-grid" aria-label="セッション一覧"></section>
  </main>

  <section id="ka-deck" class="ka-deck" hidden>
    <div id="ka-stage" class="ka-stage" aria-live="polite">
      <button class="ka-nav ka-nav--prev" id="ka-nav-prev" type="button" aria-label="前へ">
        <span class="material-symbols-rounded">chevron_left</span>
      </button>
      <button class="ka-nav ka-nav--next" id="ka-nav-next" type="button" aria-label="次へ">
        <span class="material-symbols-rounded">chevron_right</span>
      </button>
      <div id="ka-slide-root" class="ka-slide-root"></div>
      <footer class="ka-footer">
        <div class="ka-footer__brand"><span class="material-symbols-rounded">text_fields</span>コトバであそぼ</div>
        <div class="ka-footer__part" id="ka-footer-part"></div>
        <div class="ka-footer__count" id="ka-footer-count">1 / 1</div>
      </footer>
    </div>
    <div class="ka-toolbar" id="ka-toolbar">
      <button class="ka-tool" id="ka-btn-answer" type="button"><span class="material-symbols-rounded">visibility</span>答え表示</button>
      <button class="ka-tool" id="ka-btn-presenter" type="button"><span class="material-symbols-rounded">co_present</span>発表者ビュー</button>
      <button class="ka-tool" id="ka-btn-full" type="button"><span class="material-symbols-rounded">fullscreen</span>全画面</button>
    </div>
    <div class="ka-help">操作: <kbd>←</kbd> <kbd>→</kbd> <kbd>Space</kbd> <kbd>A</kbd> <kbd>F</kbd> <kbd>P</kbd></div>
  </section>

  <aside id="ka-presenter" class="ka-presenter" hidden>
    <div class="ka-pv-warn"><span class="material-symbols-rounded">visibility_off</span>この画面は共有しないでください。スタッフ専用の発表者ビューです。</div>
    <header class="ka-pv-head">
      <div class="ka-pv-head__meta" id="ka-pv-count">1 / 1</div>
      <h1 class="ka-pv-head__title" id="ka-pv-title"></h1>
      <p class="ka-pv-head__lead" id="ka-pv-lead"></p>
    </header>

    <section class="ka-pv-card">
      <h2><span class="material-symbols-rounded">desktop_windows</span>現在スライド</h2>
      <div class="ka-pv-preview" id="ka-pv-preview"></div>
    </section>

    <section class="ka-pv-card">
      <h2><span class="material-symbols-rounded">notes</span>進行メモ</h2>
      <dl class="ka-pv-facts" id="ka-pv-facts"></dl>
    </section>

    <section class="ka-pv-card">
      <h2><span class="material-symbols-rounded">chat</span>Metalife チャット用コピー</h2>
      <textarea class="ka-pv-note" id="ka-pv-note" spellcheck="false"></textarea>
      <div class="ka-pv-actions">
        <button class="ka-pv-copy" id="ka-pv-copy" type="button"><span class="material-symbols-rounded">content_copy</span>コピー</button>
        <button class="ka-pv-reset" id="ka-pv-reset" type="button">元に戻す</button>
      </div>
    </section>

    <nav class="ka-pv-nav" aria-label="発表者操作">
      <button id="ka-pv-prev" type="button"><span class="material-symbols-rounded">chevron_left</span>前へ</button>
      <button id="ka-pv-reveal" type="button"><span class="material-symbols-rounded">visibility</span>答え表示</button>
      <button id="ka-pv-next" type="button">次へ<span class="material-symbols-rounded">chevron_right</span></button>
    </nav>
    <div class="ka-pv-next" id="ka-pv-next-title"></div>
    <div class="ka-pv-conn" id="ka-pv-conn">投影画面と接続中...</div>
  </aside>

  <div id="ka-error" class="ka-error" hidden></div>

  <script src="data/manifest.js"></script>
  <script src="js/render.js"></script>
  <script src="js/engine.js"></script>
</body>
</html>
