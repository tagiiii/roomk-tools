<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>どっちにする？ | roomK</title>
  <!-- Google Fonts（Noto Sans JP）-->
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet" />
  <!-- Material Symbols Rounded -->
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,1,0" rel="stylesheet" />
  <!-- 共通デザインシステム -->
  <link rel="stylesheet" href="../shared/css/design-system.css" />
  <!-- アプリ固有スタイル -->
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="wrapper">

    <!-- ── トップ画面 ── -->
    <section class="dc-screen dc-screen--active" id="screenTop">
      <header class="dc-header">
        <span class="material-symbols-rounded dc-header__icon">alt_route</span>
        <h1 class="dc-header__title">どっちにする？</h1>
        <p class="dc-header__sub">かるい2たくをえらんであそぼう。どっちをえらんでもOK！</p>
      </header>

      <div class="dc-cat">
        <p class="dc-cat__label">カテゴリをえらぶ</p>
        <div class="dc-cat__list" id="catList" role="group" aria-label="カテゴリをえらぶ"></div>
      </div>

      <div class="dc-start">
        <button class="btn btn-primary btn-lg" id="btnStart">はじめる</button>
      </div>
    </section>

    <!-- ── カード画面 ── -->
    <section class="dc-screen" id="screenCard">
      <div class="dc-toolbar">
        <button class="btn btn-ghost btn-sm" id="btnTop">
          <span class="material-symbols-rounded">arrow_back</span>トップにもどる
        </button>
        <span class="dc-toolbar__cat" id="catLabel"></span>
      </div>

      <div class="dc-card" id="cardArea" aria-live="polite">
        <p class="dc-card__q" id="topicQ"></p>
        <div class="dc-vs" id="vsArea"></div>
        <div class="dc-alt" id="altArea"></div>
        <p class="dc-card__note">りゆうは なくてもOK。パスもOK！</p>
      </div>

      <div class="dc-next">
        <button class="btn btn-primary btn-lg" id="btnNext">つぎへ</button>
      </div>

      <p class="dc-ask" id="askHint"></p>
    </section>

  </div>

  <script type="module" src="app.js"></script>
  <script src="../shared/js/stats.js?v=1" defer></script>
  <script src="../shared/js/howto.js"></script>
  <script>
    RoomkHowto.init({
      title: 'あそびかた',
      lead: 'かるい2たくから すきなほうを えらんで あそぶツール。どっちを えらんでも OK！',
      sections: [
        { heading: 'はじめかた', items: [
          'カテゴリをえらぶ（「すべて」のままでもOK）',
          '「はじめる」をおす',
        ] },
        { heading: 'すすめかた', items: [
          'すきなほうを タップする。「どっちもいい」「どっちでもない」をえらんでもOK',
          'えらびなおすのも 自由',
          '「つぎへ」をおすと、つぎのおだいが出てくる',
        ] },
        { heading: 'おわりかた', text: 'すきなタイミングで おわってOK。「トップにもどる」でカテゴリをえらびなおせるよ。' },
      ],
    });
  </script>
</body>
</html>
