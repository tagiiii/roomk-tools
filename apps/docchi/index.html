<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>どっちにする？ | あそびのたな</title>
  <!-- Google Fonts（Noto Sans JP）-->
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&display=swap" rel="stylesheet" />
  <!-- Material Symbols Rounded -->
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,1,0" rel="stylesheet" />
  <!-- 共通デザインシステム -->
  <link rel="stylesheet" href="../shared/css/design-system.css?v=20261106" />
  <!-- アプリ固有スタイル -->
  <link rel="stylesheet" href="style.css?v=20261106look" />
</head>
<body data-genre="talk">

  <div class="wrapper">

    <!-- ── トップ画面 ── -->
    <section class="dc-screen dc-screen--active" id="screenTop">
      <div class="app-entry">
        <div class="app-hero"><img class="app-illust" src="../assets/illustrations/docchi.webp" alt="" width="156" height="156" decoding="async" onerror="this.parentNode.remove()" /></div>
        <h1 class="app-title">どっちにする？</h1>
        <p class="app-catch">軽い2択を選んで遊ぼう。どっちを選んでもOK！</p>

        <p class="dc-intro__lead app-entry__lead">軽い2択のお題が1つずつ出てくる。好きなほうを選んで、「次へ」で次のお題へ。5〜10分くらい。</p>
        <ul class="dc-intro__notes app-entry__notes">
          <li>どっちを選んでもOK。正解はない</li>
          <li>理由はなくてもOK</li>
          <li>決められないときは「その他」でもOK</li>
        </ul>

        <div class="dc-cat">
          <p class="dc-cat__label">カテゴリを選ぶ</p>
          <div class="dc-cat__list" id="catList" role="group" aria-label="カテゴリを選ぶ"></div>
        </div>

        <div class="app-entry__actions">
          <button class="btn btn-primary btn-lg" id="btnStart">はじめる</button>
        </div>
      </div>
    </section>

    <!-- ── カード画面 ── -->
    <section class="dc-screen" id="screenCard">
      <div class="dc-toolbar">
        <button class="btn btn-ghost btn-sm" id="btnTop">
          <span class="material-symbols-rounded">arrow_back</span>トップへ戻る
        </button>
        <span class="dc-toolbar__cat" id="catLabel"></span>
      </div>

      <div class="dc-card" id="cardArea" aria-live="polite">
        <p class="dc-card__q" id="topicQ"></p>
        <div class="dc-vs" id="vsArea"></div>
        <div class="dc-alt" id="altArea"></div>
        <p class="dc-card__note">理由はなくてもOK。パスもOK！</p>
      </div>

      <div class="dc-next">
        <button class="btn btn-primary btn-lg" id="btnNext">次へ</button>
      </div>

      <p class="dc-ask" id="askHint"></p>
    </section>

  </div>

  <script type="module" src="app.js"></script>
  <script src="../shared/js/stats.js?v=1" defer></script>
  <script src="../shared/js/howto.js"></script>
  <script>
    RoomkHowto.init({
      title: 'あそびかた',
      lead: '軽い2択から好きなほうを選んで遊ぶツール。どっちを選んでもOK！',
      sections: [
        { heading: 'はじめかた', items: [
          'カテゴリを選ぶ（「すべて」のままでもOK）',
          '「はじめる」を押す',
        ] },
        { heading: 'すすめかた', items: [
          '好きなほうをタップする。「その他」を選んでもOK',
          '選び直すのも自由',
          '「次へ」を押すと、次のお題が出てくる',
        ] },
        { heading: 'おわりかた', text: '好きなタイミングで終わってOK。「トップへ戻る」でカテゴリを選び直せるよ。' },
      ],
    });
  </script>
</body>
</html>
