<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ことばみっけ | room-K</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,1,0" rel="stylesheet" />
  <link rel="stylesheet" href="../shared/css/design-system.css" />
  <link rel="stylesheet" href="style.css?v=20261019b" />
</head>
<body>
  <div class="wrapper">

    <!-- 画面1: TOP -->
    <section class="kmk-screen kmk-screen--top active" id="screen-top">
      <header class="kmk-hero">
        <h1 class="kmk-hero__title">ことばみっけ</h1>
        <p class="kmk-hero__sub">お題に合う ことばを みっけよう</p>
      </header>
      <div class="kmk-limit">
        <span class="kmk-limit__label" id="limitLabel">制限時間</span>
        <div class="kmk-limit__options" role="group" aria-labelledby="limitLabel">
          <button type="button" class="kmk-limit__option" data-sec="0" aria-pressed="true">なし</button>
          <button type="button" class="kmk-limit__option" data-sec="60" aria-pressed="false">1分</button>
          <button type="button" class="kmk-limit__option" data-sec="120" aria-pressed="false">2分</button>
          <button type="button" class="kmk-limit__option" data-sec="180" aria-pressed="false">3分</button>
          <button type="button" class="kmk-limit__option" data-sec="300" aria-pressed="false">5分</button>
        </div>
      </div>
      <div class="kmk-hero__action">
        <button class="btn btn-primary btn-lg" id="btnStart">はじめる</button>
      </div>
    </section>

    <!-- 画面2: お題 -->
    <section class="kmk-screen" id="screen-odai">
      <p class="kmk-odai__label">どんなのが あるかな?</p>

      <div class="kmk-odai" aria-live="polite">
        <p class="kmk-odai__tag">お題</p>
        <p class="kmk-odai__line1">
          「<span class="kmk-odai__initial" id="odaiInitial">あ</span>」からはじまる
        </p>
        <p class="kmk-odai__theme" id="odaiTheme">やさしい言葉</p>
      </div>

      <div class="kmk-timer" id="odaiTimer" hidden>
        <p class="kmk-timer__num" id="odaiTimerLeft" role="timer">1:00</p>
        <span class="kmk-timer__track"><span class="kmk-timer__fill" id="odaiTimerFill"></span></span>
        <button type="button" class="btn btn-secondary kmk-timer__btn" id="btnTimer">スタート</button>
      </div>

      <div class="kmk-copy">
        <button class="btn btn-ghost btn-sm" id="btnCopy">
          <span class="material-symbols-rounded" aria-hidden="true">content_copy</span>
          お題をチャットにコピー
        </button>
      </div>

      <div class="kmk-reroll">
        <button class="btn btn-ghost" id="btnRerollInitial">はじめの文字を かえる</button>
        <button class="btn btn-ghost" id="btnRerollTheme">おだいを かえる</button>
        <button class="btn btn-primary" id="btnReroll">ぜんぶ かえる</button>
      </div>

      <div class="kmk-odai__foot">
        <button class="btn btn-ghost" id="btnBackTop">トップへ戻る</button>
      </div>
    </section>

  </div>

  <script type="module" src="app.js?v=20261019b"></script>
  <script src="../shared/js/stats.js?v=1" defer></script>
  <script src="../shared/js/howto.js"></script>
  <script>
    RoomkHowto.init({
      title: 'あそびかた',
      lead: '「◯からはじまる、〇〇な言葉／もの」のお題に合うことばを、みんなでさがすあそび。',
      sections: [
        { heading: 'はじめかた', items: [
          '制限時間を決めたいときは「1分」「2分」「3分」「5分」から選ぶ（「なし」なら時間は計らない）',
          '「はじめる」を押す',
          '出てきたお題を読む（むずかしかったら「はじめの文字を かえる」「おだいを かえる」で変えられる）',
        ] },
        { heading: 'すすめかた', items: [
          'お題に合うことばを思いついたら、チャットで送る',
          '「お題をチャットにコピー」を押すと、お題をチャットに貼りつけられる',
          '「ぜんぶ かえる」で つぎのお題にすすむ',
          '制限時間を決めたときは、お題の下の「スタート」を押すと時間が減りはじめる。時間になると「時間です」と出て止まる',
          '「リセット」で時間をもとにもどせる。お題をかえたときも、時間はもとにもどって「スタート」を待つ',
        ] },
        { heading: 'おわりかた', text: '「トップへ戻る」で さいしょの画面にもどれる。' },
      ],
    });
  </script>
</body>
</html>
