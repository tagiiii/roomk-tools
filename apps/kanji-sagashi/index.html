<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>漢字さがし | room-K</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,1,0" rel="stylesheet" />
  <link rel="stylesheet" href="../shared/css/design-system.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="wrapper">

    <header class="ks-header">
      <h1 class="ks-header__title">漢字さがし</h1>
      <p class="ks-header__sub">にている漢字の中から正しい漢字をさがそう！</p>
    </header>

    <!-- ===== 設定画面 ===== -->
    <main id="screen-settings" class="ks-screen active">
      <div class="card ks-card">
        <div class="ks-settings__group">
          <p class="ks-settings__label">
            <span class="material-symbols-rounded">tune</span>むずかしさ
          </p>
          <div class="ks-settings__options" id="difficulty-options">
            <button class="ks-option" data-value="easy" type="button">
              <span class="material-symbols-rounded">sentiment_satisfied</span>やさしい
            </button>
            <button class="ks-option active" data-value="normal" type="button">
              <span class="material-symbols-rounded">sentiment_neutral</span>ふつう
            </button>
            <button class="ks-option" data-value="hard" type="button">
              <span class="material-symbols-rounded">local_fire_department</span>むずかしい
            </button>
          </div>
        </div>
        <div class="ks-settings__group">
          <p class="ks-settings__label">
            <span class="material-symbols-rounded">timer</span>制限時間
          </p>
          <div class="ks-settings__options" id="time-options">
            <button class="ks-option" data-value="15" type="button">15秒</button>
            <button class="ks-option active" data-value="20" type="button">20秒</button>
            <button class="ks-option" data-value="30" type="button">30秒</button>
          </div>
        </div>
        <button class="btn btn-primary btn-lg btn-full" id="btn-start-game" type="button">
          <span class="material-symbols-rounded">play_arrow</span>はじめる
        </button>
      </div>
    </main>

    <!-- ===== お題プレビュー ===== -->
    <main id="screen-preview" class="ks-screen">
      <div class="ks-preview">
        <p class="ks-preview__label">この漢字をさがそう！</p>
        <p class="ks-preview__kanji" id="preview-kanji" aria-live="polite"></p>
        <p class="ks-preview__hint" id="preview-hint"></p>
        <button class="btn btn-primary btn-lg" id="btn-start-round" type="button">
          <span class="material-symbols-rounded">search</span>スタート
        </button>
      </div>
    </main>

    <!-- ===== プレイ画面 ===== -->
    <main id="screen-play" class="ks-screen">
      <div class="ks-play__top">
        <div class="ks-timer" id="timer-bar">
          <div class="ks-timer__fill" id="timer-fill"></div>
        </div>
        <div class="ks-play__info">
          <span class="ks-play__target" id="play-target"></span>
          <span class="ks-play__time" id="play-time" aria-live="polite"></span>
        </div>
      </div>
      <div class="ks-grid" id="kanji-grid" role="img" aria-label="漢字グリッド"></div>
    </main>

    <!-- ===== 答え合わせ画面 ===== -->
    <main id="screen-result" class="ks-screen">
      <div class="ks-result__header">
        <p class="ks-result__prompt" id="result-prompt">いくつ見つけられたかな？</p>
        <p class="ks-result__message" id="result-message" aria-live="polite"></p>
      </div>
      <div class="ks-grid ks-grid--result" id="result-grid" role="img" aria-label="結果"></div>
      <div class="ks-result__actions" id="result-actions-reveal">
        <button class="btn btn-primary btn-lg" id="btn-reveal" type="button">
          <span class="material-symbols-rounded">visibility</span>答えを見る
        </button>
      </div>
      <div class="ks-result__actions" id="result-actions-next" style="display:none">
        <button class="btn btn-primary" id="btn-next-round" type="button">
          <span class="material-symbols-rounded">arrow_forward</span>次の問題
        </button>
        <button class="btn btn-secondary" id="btn-change-settings" type="button">
          <span class="material-symbols-rounded">settings</span>設定を変える
        </button>
      </div>
    </main>

  </div>

  <script type="module" src="app.js"></script>
  <script src="../shared/js/stats.js?v=1" defer></script>
  <script src="../shared/js/howto.js"></script>
  <script>
    RoomkHowto.init({
      title: 'あそびかた',
      lead: 'にている漢字がならんだ中から、お題の漢字がいくつあるかをさがす観察ゲーム。',
      sections: [
        { heading: 'はじめかた', items: [
          'むずかしさと制限時間をえらんで、「はじめる」を押す',
          'さがす漢字をたしかめて、「スタート」を押す',
        ] },
        { heading: 'すすめかた', items: [
          '時間がおわるまでに、お題の漢字がいくつあるか数える',
          '何個見つけたか言い合ってから、「答えを見る」を押す',
          '「次の問題」で続ける。「設定を変える」で最初の画面にもどる',
        ] },
        { heading: 'おわりかた', text: '好きなタイミングで終わってOK。とくに操作はいらない。' },
      ],
    });
  </script>
</body>
</html>
