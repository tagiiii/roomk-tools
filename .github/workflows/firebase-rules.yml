name: Deploy Firebase Rules

on:
  push:
    branches: [main]
    paths:
      - database.rules.json
      - firebase.json
      - .github/workflows/firebase-rules.yml
  workflow_dispatch:

jobs:
  deploy-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Node.js セットアップ
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Firebase CLI インストール
        run: npm install -g firebase-tools

      - name: Firebase Realtime Database ルールをデプロイ
        run: |
          # サービスアカウント JSON をファイルに書き出して認証
          echo '${{ secrets.GOOGLE_APPLICATION_CREDENTIALS }}' > /tmp/sa-key.json
          export GOOGLE_APPLICATION_CREDENTIALS=/tmp/sa-key.json
          # Firestore rules はサービスアカウントに serviceusage.services.get が必要なため手動 deploy 運用。
          firebase deploy --only database --project roomk-tools
