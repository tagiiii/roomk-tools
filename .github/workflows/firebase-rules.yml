name: Deploy Firebase Rules

on:
  push:
    branches: [main]
    paths:
      - database.rules.json   # このファイルが変更されたときのみ実行
  workflow_dispatch:

jobs:
  deploy-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Node.js セットアップ
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Firebase CLI インストール
        run: npm install -g firebase-tools

      - name: Firebase Realtime Database ルールをデプロイ
        run: firebase deploy --only database --project roomk-tools --token "${{ secrets.FIREBASE_TOKEN }}"
