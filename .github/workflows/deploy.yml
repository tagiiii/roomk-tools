name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # ─────────────────────────────────────────────
  # Job 1: lint チェック（デプロイ前に実行）
  # ─────────────────────────────────────────────
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run lint
        run: bash scripts/lint.sh

  # ─────────────────────────────────────────────
  # Job 2: 公開するファイル（apps/）を成果物として上げる（lint 通過後）
  # 上げるジョブと公開するジョブを分ける（GitHub の見本と同じ形）。
  # 同じジョブで上げた直後に公開すると、成果物の一覧への反映が間に合わず
  # 「Found 0 artifact(s)」で失敗することが続いたため（2026-11-25）。
  # 分けておくと、公開だけが失敗したときに deploy ジョブだけをやり直せる。
  # ─────────────────────────────────────────────
  build:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: ./apps

  # ─────────────────────────────────────────────
  # Job 3: GitHub Pages デプロイ（成果物を上げたあと）
  # ─────────────────────────────────────────────
  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  # ─────────────────────────────────────────────
  # Job 4: デプロイ後の疎通確認
  # ─────────────────────────────────────────────
  healthcheck:
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: GitHub Pages 疎通確認
        run: |
          echo "デプロイ完了を待機中..."
          sleep 30
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://tagiiii.github.io/roomk-tools/")
          echo "HTTP ステータス: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "❌ 疎通確認失敗 (HTTP $STATUS)"
            exit 1
          fi
          echo "✅ 疎通確認OK (HTTP $STATUS)"
